<p>Clause 6.1 covers planning for all risks and opportunities relevant to the ISMS, including risk assessment and treatment. It splits them in two:</p><ol type="a"><li><b>Risks and opportunities for the ISMS as a whole</b> (6.1.1): risks to the ISMS itself, its scope, top management commitment, resources. Opportunities: ISMS performance, business value, more efficient processes and controls.</li><li><b>Information security risks</b>: loss of confidentiality, integrity and availability of information in scope, handled by <b>6.1.2</b> (assessment) and <b>6.1.3</b> (treatment).</li></ol><p>Different techniques may be used for each. The split promotes compatibility with other management system standards, requires detailed risk processes, and stresses that <b>information security risk management is the central element of an ISMS</b>.</p>
<h4 class="sec">Requirement</h4>
<p>When planning the ISMS, the organization determines the risks and opportunities, considering the issues from <b>4.1</b> and the requirements from <b>4.2</b>.</p>
<h4 class="sec">Explanation</h4>
<p>The ISMS is planned to:</p><ol type="a"><li>deliver its expected results, with security risks known to their owners and treated to an acceptable level (related risks: unclear processes and responsibilities, low awareness, weak management commitment);</li><li>prevent or reduce undesired effects (related risks: poor management, low risk awareness);</li><li>achieve continual improvement (related risk: poor management of ISMS documents and processes).</li></ol><p>Opportunities (a new product focus, a new region, a new partnership) change the context and may change the risks. A new ISMS also offers improvement opportunities: clearer interfaces, less administration, cutting processes that aren't cost-effective. Planning determines the actions, how to integrate them into ISMS processes, and how to evaluate their effectiveness.</p>
<h4 class="sec">Guidance</h4>
<p>Plan the actions with security processes and documents integrated into existing structures. Actions can differ by level (strategic, tactical, operational), site, service or system. You may handle ISMS risks separately from information security risks, or all together. An existing business planning method can satisfy 6.1.1 if it covers all requirements. Documented information is needed only as far as necessary.</p>
<h4 class="sec">Methodology: establish the context</h4>
<p>Define the objectives and the external and internal conditions that shape the scope and risk criteria. <b>External</b>: social and cultural, political, compliance and legal, technology, economic, competition, promoters. <b>Internal</b>: culture, governance and structure, standards and processes, technical components, internal technology, customers, social aspects.</p>`,
    simple: `<p>Two questions. "What could stop our ISMS from working?" (6.1.1). "What could harm our information?" (6.1.2 and 6.1.3).</p>`,
    example: "",
    pages: "135–143", quote: "Emphasizes that information security risk management is the central element of an ISMS.", qp: "137",
    q: { type: "mcq", kind: "Apply", prompt: "\"Top management shows little commitment to the ISMS.\" Which category of risk is this?",
      options: [
        ["A risk to the ISMS as a whole, handled under 6.1.1", true, "The deck gives management commitment as an example of category (a)."],
        ["An information security risk, handled under 6.1.2", false, "6.1.2 covers loss of confidentiality, integrity and availability of information."],
        ["A nonconformity under clause 10", false, "It's a risk to plan for. It becomes a nonconformity only if a requirement is actually not met."],
        ["A technical vulnerability", false, "Vulnerabilities are weaknesses exploited by threats against assets."]
      ] } },
  { id: "c6b", clause: "6.1.2", title: "Risk criteria and a repeatable process",
    goal: "Set risk criteria that make assessments consistent and comparable.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization defines and implements an information security risk assessment process.</p>
<h4 class="sec">Explanation</h4>
<p>The process:</p><ol type="a"><li>establishes and maintains (1) the <b>risk acceptance criteria</b> and (2) the criteria for performing risk assessments, which may include consequence and likelihood criteria and rules for determining the risk level;</li><li>ensures repeated assessments produce <b>consistent, valid and comparable</b> results;</li></ol><p>…and then identifies, analyses and evaluates the risks (6.1.2 c–e, next lessons). All steps and results are kept as documented information.</p>
<h4 class="sec">Guidance</h4>
<p>A risk management process: creates and protects value; is part of all processes; supports decisions; deals with uncertainty; is systematic, structured and timely; uses the best available information; is tailored; considers human and cultural factors; is transparent and inclusive; is dynamic and responsive to change; supports continual improvement. The course recommends <b>ISO 31000:2018</b> for the model.</p><p><b>Risk criteria</b> reflect the context, stakeholder requirements and top management's direction. Set criteria for <b>probability and consequence</b> and for <b>acceptance</b>, then a <b>method to combine</b> them into a risk level. Express them qualitatively, quantitatively or semi-quantitatively.</p><p><b>Acceptance criteria</b> are used in evaluation (is this risk acceptable?) and in treatment (is the proposed treatment enough?). They can be based on a maximum acceptable level, cost–benefit, or organizational considerations or consequences, and <b>must be approved by the responsible management</b>.</p><p><b>Consistent, valid, comparable</b> means: all risks are considered at the right level of detail; results are reproducible (a third party can follow them, and different people reach the same result in the same context); and repeated results are comparable (you can see if risk is rising or falling).</p>
<h4 class="sec">Methodology: step 1, establish the criteria</h4>
<ul><li>Consider the context (4.1), the ISMS scope, and the stakeholders and their requirements (4.2).</li><li>Set criteria to evaluate consequences and probabilities.</li><li>Set a method to combine them into a risk level, expressed qualitatively, quantitatively or semi-quantitatively.</li><li>Set the <b>maximum acceptable risk level</b>.</li><li>Have the criteria <b>authorized by management</b>.</li></ul><div class="fig"><div class="scroll"><table><thead><tr><th>Impact level (operation)</th><th>Example description</th></tr></thead><tbody><tr><td>No impact</td><td>Unavailability of 5 minutes or less</td></tr><tr><td>Very low</td><td>6 to 15 minutes</td></tr><tr><td>Low</td><td>15 to 30 minutes</td></tr><tr><td>Moderate</td><td>30 to 60 minutes</td></tr><tr><td>High</td><td>More than 60 minutes; an alternate processing mechanism is needed</td></tr></tbody></table></div><p class="cap">The course's example impact table. Its probability table runs from Very unlikely (only in exceptional circumstances) to Very likely (expected in most circumstances).</p></div>
<p>Risks are prioritized by severity: the higher the probability and impact, the higher the priority. The level comes from a <b>probability × impact matrix</b>.</p>`,
    simple: `<p>Agree on the measuring stick before you measure. Then two people rating the same risk get the same answer, and this year's numbers can be compared with last year's.</p>`,
    example: `<p>Without fixed criteria, one manager rates "laptop theft" High and another rates the same scenario Low. With a shared 1–5 likelihood scale and a 1–5 impact scale tied to minutes of downtime or euros lost, both arrive at the same level.</p>`,
    pages: "144–155", quote: "the results are the same when different people assess risks in the same context", qp: "152",
    q: { type: "mcq", kind: "Explain", prompt: "Why must risk assessments produce consistent, valid and comparable results?",
      options: [
        ["So the certification body can reuse your results", false, "Auditors check the process, but this isn't the reason the deck gives."],
        ["So different assessors reach the same result in the same context, and changes in risk over time can be seen", true, "This is the course's explanation."],
        ["So every risk gets the same rating", false, "Consistency means the same method gives the same result, not that all risks are equal."],
        ["So you only need to assess once", false, "Assessments are repeated at planned intervals and on change (8.2)."]
      ] } },
  { id: "c6c", clause: "6.1.2", title: "Identifying risks: assets, threats, vulnerabilities",
    goal: "Break a risk scenario into asset, threat and vulnerability.",
    body: `<h4 class="sec">Explanation: 6.1.2 c)</h4>
<p>Identify the risks of losing confidentiality, integrity and availability of information within the ISMS scope, and identify the <b>risk owners</b>: people with the authority and responsibility to manage each risk.</p>
<h4 class="sec">Guidance</h4>
<p>Risk identification finds, recognizes and describes risks: their sources, events, causes and possible consequences. The aim is a comprehensive list of events that could create, enhance, prevent, degrade, accelerate or delay the achievement of security objectives. Two approaches:</p><ul><li><b>Event-based</b>: considers risk sources generically, from past events (historical data) or anticipated ones (theory and expert opinion).</li><li><b>Asset, threat and vulnerability based</b>: considers assets with their vulnerabilities, and threats: how a threat could exploit a vulnerability of an asset and affect the objectives.</li></ul>
<h4 class="sec">Methodology: step 2, risk identification</h4>
<p>Use either approach or both. The asset–threat–vulnerability approach is the classic information security approach. <b>Don't make identification too detailed in the first cycle</b>.</p><p><b>Assets</b>. Primary: core activities and processes, proprietary technology, activities with legal and contractual requirements, and the information they use. Secondary (supporting): hardware, software, networks and connectivity, services (subcontractors, suppliers), people and decision makers (business knowledge), sites. Assets are classified by type (documents, software, infrastructure, equipment, storage, intangible and HR) and <b>valued</b> for confidentiality, integrity and availability, considering financial, legal and image impact.</p><p><b>Threat</b>: a scenario (cause) in which an action or event compromises an information asset. Threat profile: natural, or human (accidental or deliberate, internal or external), with an actor, motive and access, causing disclosure, modification, loss or interruption. Examples: physical damage, malicious code, unauthorized access or changes, illegal software, fraud and identity theft, loss of critical services, natural events.</p><p><b>Vulnerability</b>: a weakness of any kind that leaves a system exposed to a threat, or makes the threat more successful or damaging. Examples: untested applications, faulty network and equipment configuration, no business continuity policy, outdated operating systems and databases, weak communications, insufficient training, no succession plans, flood-prone areas.</p>`,
    simple: `<p>A <b>threat</b> uses a <b>vulnerability</b> to harm an <b>asset</b>. Find all three and you've described the risk.</p>`,
    example: `<p>"An attacker (threat) exploits an unpatched VPN appliance (vulnerability) to steal the customer database (asset), causing fines and lost trust (consequence)."</p>`,
    pages: "156–167", quote: "It is not recommended that risk identification be too detailed in the first risk assessment cycle.", qp: "157",
    q: { type: "mcq", kind: "Apply", prompt: "\"An attacker uses an unpatched VPN appliance to steal customer data.\" What is the vulnerability?",
      options: [
        ["The attacker", false, "The attacker is the threat (the cause)."],
        ["The unpatched VPN appliance", true, "The missing patch is the weakness the threat exploits."],
        ["The customer data", false, "That is the asset being harmed."],
        ["The data theft", false, "That is the event and its consequence."]
      ] } },
  { id: "c6d", clause: "6.1.2", title: "Analysing and evaluating risk",
    goal: "Turn likelihood and consequence into a risk level and a priority list.",
    body: `<h4 class="sec">Explanation: 6.1.2 d) and e)</h4>
<p><b>Analysis</b>: (1) assess the potential consequences if a risk happens, such as money lost or reputational damage, quantitatively or qualitatively; (2) assess the <b>realistic likelihood</b>, as probability, frequency or a qualitative value; (3) determine the <b>risk level</b> as a predefined combination of the two.</p><p><b>Evaluation</b>: (1) compare the results with the acceptance criteria set earlier; (2) <b>prioritize</b> the risks for treatment, deciding how urgently each unacceptable risk is treated and in what order.</p>
<h4 class="sec">Guidance</h4>
<p>Analysis determines the risk level. Techniques are <b>qualitative</b> (high, medium, low), <b>quantitative</b> (money, frequency, probability) or <b>semi-quantitative</b> (qualitative scales with values); consider how objective the technique is. Both identification approaches suit analysis, and it works best with experts in the risks discussed.</p><p>Evaluation uses the organization's decision-making to compare each level with the criteria and decide treatment. It shows a risk's magnitude, not its urgency, so its output is a <b>list of risks in order of priority</b>. Keep extra detail from identification and analysis to support treatment decisions.</p>
<h4 class="sec">Methodology: steps 3 and 4</h4>
<p>The course's scales: probability from <b>Rare</b> (exceptional), Unlikely, Possible, Likely to <b>Frequent</b> (normally occurs); impact from <b>Insignificant</b> (no harm), Minor (controllable), Moderate (needs third-party help), Major (loss of capacity) to <b>Catastrophic</b> (impossible to react). The matrix below gives the level.</p><p>Risk map categories: <b>acceptable</b> (low risk, routine procedures); <b>tolerable</b> (moderate, management responsibility specified); <b>unacceptable</b> (high, top management attention); <b>impermissible</b> (extreme, immediate action).</p><div class="fig"><div class="scroll"><table><thead><tr><th>Existing controls</th><th>Meaning</th></tr></thead><tbody><tr><td>Uncontrollable</td><td>No control over the probability or the consequences</td></tr><tr><td>Weak</td><td>Controls are insufficient, or not known</td></tr><tr><td>Moderate</td><td>Controls don't cover all potential risk events</td></tr><tr><td>Strong</td><td>Economically viable controls are managed, followed up and monitored</td></tr></tbody></table></div><p class="cap">The course also rates existing controls, which affects the residual risk.</p></div>`,
    diagram: `<div class="fig"><div class="scroll"><table class="matrix" aria-label="Risk level matrix">
<thead><tr><th>Likelihood ↓ / Impact →</th><th>Insignificant</th><th>Minor</th><th>Moderate</th><th>Major</th><th>Catastrophic</th></tr></thead>
<tbody>
<tr><th>Rare</th><td class="L">L</td><td class="L">L</td><td class="M">M</td><td class="H">H</td><td class="H">H</td></tr>
<tr><th>Unlikely</th><td class="L">L</td><td class="L">L</td><td class="M">M</td><td class="H">H</td><td class="E">E</td></tr>
<tr><th>Possible</th><td class="L">L</td><td class="M">M</td><td class="H">H</td><td class="E">E</td><td class="E">E</td></tr>
<tr><th>Likely</th><td class="M">M</td><td class="H">H</td><td class="H">H</td><td class="E">E</td><td class="E">E</td></tr>
<tr><th>Frequent</th><td class="H">H</td><td class="H">H</td><td class="E">E</td><td class="E">E</td><td class="E">E</td></tr>
</tbody></table></div>
<p class="cap">L low · M moderate · H high · E extreme. Reconstructed from the course diagram. Check its orientation against your course material.</p></div>`,
    simple: `<p>How likely × how bad = how big the risk is. Compare that with what management said is acceptable, then sort the list so the worst risks come first.</p>`,
    example: "",
    pages: "168–175", quote: "The output of this step should be a list of risks in order of priority.", qp: "173",
    q: { type: "mcq", kind: "Recall", prompt: "What does risk evaluation produce?",
      options: [
        ["The Statement of Applicability", false, "The SoA comes later, from risk treatment (6.1.3)."],
        ["A list of risks in order of priority", true, "Evaluation compares levels with acceptance criteria and prioritizes."],
        ["The asset inventory", false, "The asset inventory is an input to identification."],
        ["The risk treatment plan", false, "The treatment plan is produced in 6.1.3."]
      ] } },
  { id: "c6e", clause: "6.1.3", title: "Risk treatment options",
    goal: "Pick the right treatment option for a given risk.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization defines and implements an information security risk treatment process: <b>select treatment options</b>, <b>determine the controls</b> to implement them, <b>formulate a risk treatment plan</b>, and <b>obtain the risk owners' approval</b> of the plan. All steps and results are kept as documented information.</p>
<h4 class="sec">Guidance: treatment options</h4>
<ol type="a"><li><b>Avoid</b>: don't start or continue the activity, or remove the risk source (close an e-commerce portal).</li><li><b>Assume more risk</b> to pursue a business opportunity (open an e-commerce portal).</li><li><b>Modify</b>: change the probability (reduce vulnerabilities) or the consequences (diversify assets), or both.</li><li><b>Share</b>: insurance, subcontracting or risk financing.</li><li><b>Retain</b>: accept the risk under the acceptance criteria or by informed decision (keep the existing portal as it is).</li></ol><p>Each risk is treated with one or more options, in line with the security objectives, until it meets the acceptance criteria. The course also summarizes controls as: mitigate, avoid, transfer, assume.</p>
<h4 class="sec">Guidance: determining the controls</h4>
<p>Controls must be based on the <b>assessed risks</b>. A poor risk assessment gives a poor basis for choosing controls, making treatment ineffective, inefficient and costly. A good choice includes every necessary control, no unnecessary ones, with the right breadth and depth. You must be able to show the link from each control to the risk results.</p><p>One option may need several controls: for example, changing consequences may need controls to <b>detect</b> the event quickly, and to <b>respond</b> and <b>recover</b>. Consider controls for outsourced applications, processes and functions, usually as security requirements in supplier agreements with a way to check they are met.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The standard adds that controls can be designed by the organization or taken <b>from any source</b> (6.1.3 b, note 1). It doesn't name the treatment options; those come from ISO 31000 and ISO 27005, as the course uses.</p></div>`,
    simple: `<p>For each risk: stop doing it, reduce it, pass it to someone else, or knowingly live with it. Sometimes you take on more risk on purpose for a business opportunity.</p>`,
    example: "",
    pages: "176–183", quote: "Sharing risk with other parties through insurance, subcontracting or risk financing", qp: "177",
    q: { type: "mcq", kind: "Apply", prompt: "You buy cyber insurance that covers ransomware recovery costs. Which treatment option is this?",
      options: [
        ["Avoid", false, "You keep doing the activity; the risk source isn't removed."],
        ["Modify", false, "Insurance doesn't change the likelihood of an attack."],
        ["Share", true, "Insurance is the deck's first example of sharing risk."],
        ["Retain", false, "Retaining means accepting the risk without passing any of it on."]
      ] } },
  { id: "c6f", clause: "6.1.3", title: "Annex A and the Statement of Applicability",
    goal: "Build an SoA and justify excluded controls.",
    body: `<h4 class="sec">Guidance: compare with Annex A</h4>
<p>Annex A lists control objectives and controls. Lead implementers must make sure <b>no necessary control is overlooked</b>, and may find alternative controls that modify the risk better. Annex A is <b>not exhaustive</b>: add controls as needed. You don't need every Annex A control, but any control that doesn't help modify a risk may be excluded <b>only with a justification</b>.</p>
<h4 class="sec">Guidance: the Statement of Applicability</h4>
<p>The SoA contains:</p><ul><li>every control considered necessary, with the <b>justification for including it</b> (based on its effect in modifying a risk, with a reference to the risk assessment and treatment results);</li><li>whether it is <b>implemented</b>: fully, in progress or not yet started;</li><li>the <b>justification for excluding</b> any Annex A control.</li></ul><p>Valid reasons to exclude: the control isn't required; it is outside the ISMS scope; or a <b>custom control</b> (one not in Annex A) covers it.</p><p>A practical SoA is a table of all 93 Annex A controls plus any additional ones. Columns: needed or not (with the treatment option), reason for inclusion or exclusion, implementation status. Extra columns can show how the control works, references to policies or procedures, and who operates it.</p>
<h4 class="sec">Methodology: steps 7 and 8</h4>
<p>Compare your controls with Annex A, then generate the SoA. The course's example SoA row: <i>Remote work</i>, applicable <b>No</b>, justification "No remote work is performed within the organization"; <i>Intellectual property rights</i>, applicable <b>Yes</b>, selected to comply with intellectual property regulations.</p>`,
    simple: `<p>The SoA is a checklist of all 93 Annex A controls. For each one: do we use it, why or why not, and is it done yet?</p>`,
    example: "",
    pages: "184–189", quote: "any control within ISO/IEC 27001:2022, Annex A that does not contribute to modifying the risk may be excluded but the exclusion must be justified.", qp: "184",
    q: { type: "mcq", kind: "Apply", prompt: "Your organization has no remote work. What should the SoA say about Annex A control 6.7, Remote working?",
      options: [
        ["Remove the control from the SoA", false, "The SoA should list Annex A controls, including the excluded ones with their justification."],
        ["Mark it not applicable and record why (no remote work is performed)", true, "This is the course's own SoA example."],
        ["Implement it anyway, because all 93 controls are mandatory", false, "Annex A controls can be excluded with justification."],
        ["Leave the row blank until the audit", false, "Every Annex A control needs a decision and a reason."]
      ] } },
  { id: "c6g", clause: "6.1.3", title: "Risk treatment plan and owner approval",
    goal: "Know what the treatment plan contains and who signs it off.",
    body: `<h4 class="sec">Guidance: the risk treatment plan</h4>
<p>ISO/IEC 27001 doesn't prescribe a structure. Build the plan from the previous step. For each risk it records the <b>selected treatment options</b>, the <b>necessary controls</b>, and the <b>implementation status</b>. It can also record the <b>risk owner</b> and the <b>expected residual risk</b>. Any action needs responsibilities and deadlines.</p>
<h4 class="sec">Methodology: step 9, design the plan</h4>
<div class="fig"><div class="scroll"><table><thead><tr><th>Course template columns</th></tr></thead><tbody><tr><td>Risk code · description · risk level · business process · related assets · strategy · actions to develop · Annex A reference control · control type · responsible person · deadline</td></tr></tbody></table></div></div>

<h4 class="sec">Guidance: approval by risk owners</h4>
<p>When formulating the plan, obtain authorization from the <b>risk owners</b>, based on the risk acceptance criteria or a justified exception. Through its management processes the organization records the residual risk owner's <b>acceptance of the risk</b> and <b>management's approval of the plan</b>. For example, add columns to the plan for control effectiveness, residual risk value and risk owner approval.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The standard puts it this way: obtain the <b>risk owners' approval of the treatment plan</b> and their <b>acceptance of the residual risks</b> (6.1.3 f). For the exam: the risk owners approve the plan and accept residual risk.</p></div>`,
    simple: `<p>For each risk: what we'll do, with which control, who does it, and by when. Then the person who owns the risk signs off on what's left over.</p>`,
    example: "",
    pages: "190–193", quote: "When formulating the information security risk treatment plan, the organization must obtain authorization from the risk owners.", qp: "193",
    q: { type: "open", kind: "Recall", prompt: "Who approves the risk treatment plan and accepts the residual risk?",
      answer: `<p>The <b>risk owners</b>. Clause 6.1.3 f) requires the risk owners' approval of the treatment plan and their acceptance of the residual risks, and that approval is recorded.</p>` } },
  { id: "c6h", clause: "6.2–6.3", title: "Security objectives and planned change",
    goal: "Write a security objective that meets 6.2.",
    body: `<h4 class="sec">6.2 Requirement</h4>
<p>The organization establishes information security objectives and plans how to achieve them at relevant levels and functions.</p>
<h4 class="sec">Explanation</h4>
<p>Objectives help implement strategic goals and the security policy, and help specify and measure the performance of controls and processes. If the policy contains objectives, they must meet 6.2; if it contains a framework, the objectives it produces must meet 6.2. Requirements come from the context (4.1) and stakeholders (4.2). Risk assessment and treatment results feed the ongoing review of objectives, and objectives in turn feed the risk criteria.</p><p>Objectives should be <b>measurable</b> if possible, <b>linked</b> to security requirements and risk results, <b>consistent</b> with the policy, <b>communicated</b>, and <b>updated</b> as appropriate. When planning, determine <b>what</b> will be done, what <b>resources</b>, <b>who</b> is responsible, <b>when</b> it will be completed, and <b>how</b> results are evaluated.</p>
<h4 class="sec">Guidance</h4>
<p>Objectives can be expressed as: numerical limits ("do not exceed…", "reach level 4"); goals for performance measures; goals for ISMS effectiveness; compliance with ISO/IEC 27001 and with ISMS procedures; completing actions and plans; risk criteria to be met.</p><ul><li><b>Consistent</b>: specific objectives link to the policy's objectives, or follow its framework.</li><li><b>Measurable</b>: not always possible, but it helps to tell whether an objective was met and to guide extra effort.</li><li><b>Linked and communicated</b>: use risk assessment and treatment results as inputs.</li><li><b>Updated</b>: when needs change, update objectives and communicate the change.</li></ul><p>Plans can take any form (one security plan, project plans, or actions in other plans) but define at least: activities, resources, responsibilities, schedules and milestones, and methods to check results. Objectives must be kept as documented information.</p>
<h4 class="sec">6.3 Planning of changes</h4>
<p><b>Requirement:</b> when the organization determines a need for changes to the ISMS, they are carried out in a planned manner. <b>Explanation:</b> changes are planned and controlled, with a plan for how they will be implemented and validated.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>6.2 also requires objectives to <b>be monitored</b> (6.2 d), which the course's list leaves out.</p></div>`,
    simple: `<p>Good objectives are specific and measurable, tied to your real risks, and have an owner and a deadline.</p>`,
    example: "",
    pages: "194–207", quote: "Be measurable, if possible; this means that it is important to be able to determine whether or not an objective has been met.", qp: "197",
    q: { type: "mcq", kind: "Apply", prompt: "Which objective best meets 6.2?",
      options: [
        ["\"Be more secure this year.\"", false, "Not measurable, and no owner, deadline or method of evaluation."],
        ["\"Cut the phishing-simulation click rate from 12% to under 5% by Q4. Owner: awareness lead. Measured quarterly.\"", true, "Measurable, with an owner, a deadline and an evaluation method."],
        ["\"Buy a SIEM.\"", false, "That's an action or a purchase, not an objective with a measurable outcome."],
        ["\"Improve security culture across the company.\"", false, "A good aim, but it can't be checked as met or not met."]
      ] } }
  ] },

{ id: "clause-7", num: "7", title: "Support", phase: "Plan", pages: "208–241",
  blurb: "Resources, competence, awareness, communication and documented information.",
  cards: [
  { id: "c7a", clause: "7.1–7.2", title: "Resources and competence",
    goal: "Plan ISMS resources and show that people are competent.",
    body: `<h4 class="sec">7.1 Requirement</h4>
<p>The organization determines and provides the resources to establish, implement, maintain and continually improve the ISMS.</p>
<h4 class="sec">Explanation</h4>
<p>Resource categories: <b>people</b> to run the activities; <b>time</b> to do them and to let results settle; <b>financial</b> resources; <b>information</b> to support decisions and measure performance; <b>infrastructure</b> and other means (technology, tools, materials). Keep them aligned with the ISMS's needs.</p>
<h4 class="sec">Guidance</h4>
<p>Estimate the resources for all ISMS activities (quantity and quality); acquire them; provide them; maintain them; review them against needs and adjust. Documented information is needed only as far as necessary.</p>
<h4 class="sec">7.2 Competence</h4>
<p><b>Competence</b> is the ability to apply knowledge and skills to achieve intended results, influenced by knowledge, experience and wisdom. It applies to everyone working under the organization's control, not only employees. It can be built internally or externally through experience, training, mentoring or outsourcing. Temporary needs can be met by external people, whose competence must also be described and verified.</p><p>The organization should:</p><ul><li>determine the competence expected for each ISMS role;</li><li>fill roles by finding competent people internally, training people to reach the competence, or hiring;</li><li><b>evaluate the effectiveness</b> of those actions and verify people are competent;</li><li>make sure competence keeps up with needs over time.</li></ul><p>Adequate documented information is <b>required as proof of competence</b>: what competence is needed and how people achieved it.</p>`,
    simple: `<p>Give the ISMS enough people, time, money and tools. Make sure the people know their job, check that training actually worked, and keep proof.</p>`,
    example: "",
    pages: "213–218", quote: "It is the ability to apply knowledge and skills for the achievement of intended results, and is influenced by knowledge, experience and wisdom.", qp: "216",
    q: { type: "mcq", kind: "Apply", prompt: "You sent a new risk analyst on a risk assessment course. What does 7.2 still require?",
      options: [
        ["Nothing more; attending the course proves competence", false, "Attendance alone doesn't show the action worked."],
        ["Evaluate whether the training worked, and keep documented evidence of competence", true, "7.2 asks you to evaluate the effectiveness of actions and keep evidence."],
        ["Have the certification body test them", false, "Verifying competence is the organization's job."],
        ["Replace them with an external consultant", false, "External hires are one option, not a requirement."]
      ] } },
  { id: "c7b", clause: "7.3", title: "Awareness",
    goal: "Name what everyone in scope must be aware of.",
    body: `<h4 class="sec">Requirement</h4>
<p>People working under the organization's control are aware of the security measures and policies, their contribution to the ISMS's effectiveness, the benefits of better security, and the implications of not conforming.</p>
<h4 class="sec">Explanation</h4>
<p>Awareness means having the knowledge, understanding and motivation about what is expected. People must know, understand and accept that they (a) support the objectives in the security policy and (b) follow the rules in their daily tasks. They also need to accept the implications of not complying, for information security and for themselves, and know that a policy exists and where to find it.</p><p>Most staff <b>don't need the detailed content of the policy</b>. They <b>do</b> need to know, understand, accept and apply the objectives and requirements derived from it that affect their job, often written into the standards and procedures they follow.</p>
<h4 class="sec">Guidance</h4>
<ul><li>Build a programme with specific messages for each audience (internal and external people).</li><li>Weave security needs into training on other topics, to put them in operational context.</li><li>Check knowledge and understanding at the end of sessions and at random between them.</li><li>Check people act on the messages; use examples of good and bad behaviour.</li></ul>`,
    simple: `<p>Everyone knows the policy exists and where to find it, what it means for their job, why it helps, and what happens if they ignore it.</p>`,
    example: "",
    pages: "219–222", quote: "Many of an organization's personnel don’t need to know the detailed content of the policy, but they DO need to know, understand, accept and implement the information security objectives and requirements derived from the policy that affect their job role.", qp: "221",
    q: { type: "mcq", kind: "Recall", prompt: "Which of these is NOT something 7.3 requires everyone in scope to be aware of?",
      options: [
        ["The information security policy", false, "Required."],
        ["Their contribution to the ISMS's effectiveness", false, "Required."],
        ["The implications of not conforming", false, "Required."],
        ["The detailed technical configuration of every control", true, "The deck says most staff need what affects their role, not full detail."]
      ] } },
  { id: "c7c", clause: "7.4", title: "Communication",
    goal: "Plan what to communicate, when, with whom and how.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization determines the internal and external communication needs related to the ISMS.</p>
<h4 class="sec">Explanation</h4>
<p>Communication is a key ISMS process, internal or external, started inside the organization or by an outside party. Determine:</p><ul><li><b>what</b> to communicate (policies, objectives, procedures and their changes, risk knowledge, supplier requirements, performance feedback);</li><li>the best <b>timing</b>;</li><li><b>who</b> takes part and the target audience;</li><li><b>who initiates</b> each communication;</li><li>which <b>processes</b> drive or are affected by it.</li></ul>
<h4 class="sec">Guidance</h4>
<p>Content to communicate: risk management plans and results; security objectives; objectives achieved (such as a certificate or data protection compliance); incidents and crises; roles, responsibilities and authorities; information exchanged between ISMS processes; ISMS changes; issues found in reviews; matters for regulators; requests from customers and authorities.</p><p>Also define: <b>who may communicate</b> internally and externally (for example during a data breach), with assigned authority; triggers or frequency; pre-approved messages for high-impact scenarios (in communication, incident response or continuity plans); recipient lists; official media and channels that protect confidentiality and integrity; and how to confirm messages were received and understood. Classify communications. Documented information is needed only as far as necessary.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The 2022 standard lists four items: <b>what, when, with whom and how</b> (7.4 a–d). "Who initiates" and "which processes" in the course come from the 2013 edition; they remain good practice.</p></div>`,
    simple: `<p>Before something goes wrong, decide who speaks for the organization, what they'll say, and through which channel.</p>`,
    example: `<p>During a breach, a helpdesk technician posts details on social media before legal and management have assessed it. A communication plan naming an authorized spokesperson and pre-approved messages would have prevented this.</p>`,
    pages: "223–227", quote: "who can communicate externally and internally (e.g., in special cases such as a data breach), assign specific roles with appropriate authority.", qp: "226",
    q: { type: "mcq", kind: "Apply", prompt: "After a data breach, a helpdesk technician posts the details on social media. Which part of 7.4 was missing?",
      options: [
        ["Defined roles with the authority to communicate externally", true, "The deck calls for naming who may communicate, especially in a breach."],
        ["A larger awareness budget", false, "Awareness helps, but the direct gap is who is authorized to speak."],
        ["An updated risk acceptance criterion", false, "That belongs to 6.1.2, not communication."],
        ["Stronger encryption", false, "This is a communication failure, not a technical one."]
      ] } },
  { id: "c7d", clause: "7.5", title: "Documented information",
    goal: "Create, update and control ISMS documents correctly.",
    body: `<h4 class="sec">7.5.1 Requirement</h4>
<p>The ISMS includes the documented information <b>required by ISO/IEC 27001</b> and what the organization determines is <b>necessary for its effectiveness</b>.</p>
<h4 class="sec">Explanation</h4>
<p>Documented information is needed to define and communicate objectives, policy, guidelines, controls, processes and procedures (who does what, and how); for audits and to keep the ISMS stable when key people change; and to record actions, decisions and results. Typical structure: <b>policy → procedures → instructions, plans, formats and guides → records</b>. The amount usually relates to the organization's size, and must be enough to support the performance evaluation in clause 9.</p>
<h4 class="sec">Guidance: documents the organization may decide it needs</h4>
<p>Policies, rules and directives; results of context setting; roles, responsibilities and authorities; reports on the phases of risk management; expected competence; plans and results of awareness and communication; the process for controlling documents; processes and procedures to implement, maintain and improve the ISMS; action plans; evidence of ISMS results; necessary documents of external origin.</p>
<h4 class="sec">7.5.2 Creating and updating</h4>
<p><b>Requirement:</b> ensure proper identification and description, format and media, and review and approval. <b>Explanation:</b> define how documents are best structured; management review and approval makes them correct and fit for purpose; periodic reviews keep them suitable.</p><p><b>Guidance:</b> documents can be paper, electronic, web pages, databases, audio or video. Build a structured library: framework structure, templates, responsibilities for preparing, approving, publishing and managing, and a review and approval process. Common attributes: type, purpose and scope, title, publication date, classification, reference number, version and history, author, owner, approver. Define languages, file formats and media. Avoid duplication; use cross-references. Set review criteria (time-based or content-based) and approval criteria.</p>
<h4 class="sec">7.5.3 Control</h4>
<p><b>Requirement:</b> manage documented information throughout its life cycle and make it available where and when needed. Once approved, communicate it to its audience, preserving integrity, confidentiality and relevance.</p><p><b>Guidance:</b> use a structured library. Classify and protect documents by classification level; only authorized people may change or distribute them. Define stakeholders, means of distribution, access, retrieval and use. Set retention periods, keep documents legible throughout, decide what happens after retention ends, and manage documents of external origin (customers, partners, suppliers, regulators).</p>`,
    diagram: `<div class="fig"><div class="pyr">
<div style="width:34%">Policy</div><div style="width:52%">Procedures</div><div style="width:72%">Instructions, plans, formats, guides</div><div style="width:92%">Records</div></div>
<p class="cap">Typical documentation structure.</p></div>`,
    simple: `<p>Write down what matters, label it clearly, get it approved, keep the latest version where people can find it, protect it, and keep records as proof.</p>`,
    example: "",
    pages: "228–241", quote: "Documented information is available where and when it is needed, while preserving its integrity, confidentiality and relevance throughout its life cycle.", qp: "239",
    q: { type: "mcq", kind: "Apply", prompt: "An approved procedure exists in three versions on a shared drive, and staff don't know which is current. Which requirement is failing?",
      options: [
        ["7.5.3 Control of documented information", true, "The right version isn't reliably available, and changes aren't controlled."],
        ["7.2 Competence", false, "Staff skill isn't the problem; document control is."],
        ["9.3 Management review", false, "Management review isn't the direct issue."],
        ["4.3 Scope", false, "This has nothing to do with the ISMS boundary."]
      ] } }
  ] },

{ id: "clause-8", num: "8", title: "Operation", phase: "Do", pages: "242–259",
  blurb: "Running the planned processes, changes, suppliers, and repeating risk work.",
  cards: [
  { id: "c8a", clause: "8.1", title: "Operational planning and control",
    goal: "Control planned changes, unplanned changes and outsourced processes.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization plans, implements and controls processes to meet security requirements and achieve its objectives; keeps documented information to provide confidence that processes run as intended; monitors planned changes and reviews the consequences of undesired changes; and ensures outsourced processes are identified, defined and controlled.</p>
<h4 class="sec">Explanation</h4>
<p>Based on the planning in 6.1 and 6.2, the organization carries out the tasks needed. The processes include (a) <b>ISMS processes</b> such as management review and internal audit, and (b) <b>processes to implement the risk treatment plan</b>. The organization remains responsible for outsourced processes, so it must (c) determine them considering the outsourcing risks and (d) control them (plan, monitor, review). Once running, processes are managed and reviewed against the requirements from 4.2. Planned and unintended changes are assessed to control adverse effects. Documented evidence feeds clause 9.</p>
<h4 class="sec">Guidance</h4>
<p>Implement, operate and verify: security-specific processes (risk, incident and continuity management, internal audits, management reviews); processes arising from the controls in the treatment plan; reporting structures (incident reports, objective compliance, activity reports); meeting structures (frequency, participants, purpose, authority). Coordinate through representatives of different parts of the organization.</p><div class="fig"><div class="scroll"><table><thead><tr><th>Situation</th><th>What the organization should do</th></tr></thead><tbody><tr><td>Planned changes</td><td>Plan them with tasks, responsibilities, deadlines and resources; implement; follow up; keep evidence they were done as planned</td></tr><tr><td>Unanticipated changes</td><td>Examine the consequences; check for adverse effects; plan and take action to mitigate; keep records</td></tr><tr><td>External suppliers</td><td>Identify every outsourcing relationship; set interfaces; put security in agreements; monitor and review services against the risk acceptance criteria; manage changes</td></tr></tbody></table></div></div>

<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The 2022 text adds that control is achieved by <b>establishing criteria for the processes</b> and controlling them against those criteria, and it speaks of <b>externally provided processes, products or services</b> rather than only outsourced processes.</p></div>`,
    simple: `<p>Run what you planned, keep proof, handle changes carefully, and keep an eye on suppliers. Outsourcing a task doesn't outsource the responsibility.</p>`,
    example: "",
    pages: "247–254", quote: "Ultimately, the organization remains responsible for planning and controlling any outsourced processes to achieve its information security objectives.", qp: "248",
    q: { type: "mcq", kind: "Apply", prompt: "Your payroll processing is outsourced to a provider. Who remains responsible for controlling it under 8.1?",
      options: [
        ["The payroll provider alone", false, "The provider performs the work, but responsibility stays with you."],
        ["Your organization", true, "Stated directly in the course."],
        ["The certification body", false, "Certification bodies audit; they don't take on responsibility."],
        ["Nobody, once a contract is signed", false, "You must still monitor and review supplier services."]
      ] } },
  { id: "c8b", clause: "8.2–8.3", title: "Running risk assessment and treatment",
    goal: "Separate defining the risk process (clause 6) from running it (clause 8).",
    body: `<h4 class="sec">8.2 Requirement</h4>
<p>The organization conducts information security risk assessments and preserves documented information on them.</p>
<h4 class="sec">Explanation</h4>
<p>The organization runs the risk assessment process established in the Planning phase. It should:</p><ul><li>plan assessments, including when significant changes occur in the ISMS or its context, or after security incidents;</li><li>decide which changes or incidents need an additional assessment, and how it is triggered;</li><li>refine the detail of identification gradually in later iterations;</li><li>assess at least <b>once a year</b>.</li></ul>
<h4 class="sec">8.3 Requirement</h4>
<p>The organization implements the risk treatment plan and keeps documented information on the results. (The course repeats the treatment plan template here.)</p>
<h4 class="sec">Explanation and guidance</h4>
<p>Carry out the treatment defined in 6.1.3. Whenever the assessment is updated under 8.2, apply 6.1.3 again, update the plan and implement it again. Keep the results as evidence that 6.1.3 was performed as defined. Run treatment after each assessment iteration, or when the plan or part of it fails; use this activity to drive and monitor progress of the plan.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The standard's triggers are <b>planned intervals</b> or <b>when significant changes are proposed or occur</b>, using the criteria from 6.1.2 a). "At least once a year" is the course's recommendation, not a requirement.</p></div>`,
    simple: `<p>Clause 6 designs the risk process. Clause 8 runs it, regularly and whenever something big changes.</p>`,
    example: "",
    pages: "255–259", quote: "Conduct an information security risk assessment at least once a year.", qp: "256",
    q: { type: "mcq", kind: "Recall", prompt: "What is the difference between 6.1.2 and 8.2?",
      options: [
        ["They are the same requirement, repeated", false, "One defines the process; the other carries it out."],
        ["6.1.2 defines the risk assessment process; 8.2 performs it at planned intervals and on change", true, "8.2 executes the process set up in the planning phase."],
        ["6.1.2 is for IT risks; 8.2 is for business risks", false, "Both cover information security risks."],
        ["8.2 replaces 6.1.2 after certification", false, "Both stay in force."]
      ] } }
  ] },

{ id: "clause-9", num: "9", title: "Performance evaluation", phase: "Check", pages: "260–292",
  blurb: "Measuring, internal audit and management review.",
  cards: [
  { id: "c9a", clause: "9.1", title: "Monitoring and measurement",
    goal: "Tell performance measures from effectiveness measures.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization evaluates information security performance and the effectiveness of the ISMS.</p>
<h4 class="sec">Explanation</h4>
<p><b>Monitoring and measurement</b> help judge whether security activities, including risk assessment and treatment, achieved their intended outcome. The organization establishes: what to monitor and measure; who monitors and measures, and when; and the methods that give valid (comparable and reproducible) results.</p><p><b>Analysis and evaluation</b>: who analyses and evaluates the results, and when, with valid methods. Two aspects: <b>performance</b> (is the organization doing what it planned; do ISMS processes meet their specifications?) and <b>ISMS effectiveness</b> (is it doing things the right way; are the security objectives being met?).</p>
<h4 class="sec">Guidance</h4>
<p>Start with the <b>information need</b>: a high-level question or statement that helps evaluate performance and effectiveness. Measure for a defined purpose; measuring too much or the wrong attributes is impractical, costly and counterproductive.</p><ul><li><b>Performance measures</b>: planned results in terms of the activity, such as headcount, milestones reached, how far controls are implemented.</li><li><b>Effectiveness measures</b>: the effect of the activities on the security objectives.</li></ul><p>The course's examples of what to measure: project progress; fall in risk value between periods; budget coverage; stakeholders' security perception; policy knowledge; fewer incidents; incident management; effectiveness of corrective actions; lessons learned applied; personnel evaluation; fewer nonconformities per process; remote working safety checks; delay in withdrawing privileges; equipment maintenance efficiency; password-related incidents; joiners and leavers; controlled removable media; backup recoveries; evacuation drills; threats detected by antivirus; fewer technical vulnerabilities between periods.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The standard also requires <b>documented information as evidence of the results</b> (9.1), which the course doesn't mention.</p></div>`,
    simple: `<p>Performance: did we do the thing? Effectiveness: did doing it make us more secure?</p>`,
    example: "",
    pages: "265–269", quote: "It is impractical, costly and counterproductive to measure too much or to choose the wrong attributes.", qp: "268",
    q: { type: "mcq", kind: "Apply", prompt: "Which of these is an effectiveness measure?",
      options: [
        ["95% of staff completed awareness training", false, "This measures an activity being done, so it's a performance measure."],
        ["The phishing-simulation click rate fell from 12% to 4%", true, "This shows the effect on a security outcome."],
        ["Twelve policies were published this quarter", false, "Output count, so a performance measure."],
        ["The project hit 8 of 10 milestones", false, "Milestones are named as a performance measure."]
      ] } },
  { id: "c9b", clause: "9.2", title: "Internal audit: programme, plan, criteria",
    goal: "Separate audit programme, audit plan and audit criteria.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization conducts internal audits to provide information on whether the ISMS conforms to the requirements.</p>
<h4 class="sec">Explanation</h4>
<p>Internal audits at planned intervals give top management assurance about the ISMS. Audit principles (ISO 19011): <b>integrity, fair presentation, due professional care, confidentiality, independence, evidence-based approach</b>. Audits check conformity with the organization's own requirements (policy and procedures; the objectives framework, including risk treatment results; legal and contractual requirements; documented information requirements) and with ISO/IEC 27001, and whether the ISMS is <b>effectively implemented and maintained</b>.</p><div class="fig"><div class="scroll"><table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody><tr><td>Audit programme</td><td>The general framework for a group of audits planned for specific times and purposes</td></tr><tr><td>Audit plan</td><td>The activities and arrangements for one specific audit</td></tr><tr><td>Audit criteria</td><td>Policies, procedures or requirements that audit evidence is compared against: what auditors expect to find</td></tr></tbody></table></div></div>

<h4 class="sec">Guidance: managing the programme</h4>
<p>The programme sets the structure and responsibilities for planning, conducting, reporting and following up audits; ensures appropriate scope, minimal disruption, audit quality, competent teams, records, and coverage of the whole ISMS within a set period. It documents types, duration, locations and timing, plus criteria, methods, team selection, confidentiality and security arrangements. Scope and frequency are <b>risk-based</b> (size, nature, complexity, maturity). Cover all necessary controls over time, include key controls in each audit, and let processes run long enough to produce evidence. ISMS audits can be combined with other management system audits.</p><p><b>Auditors</b>: define competence requirements; choose competent internal or external auditors who are <b>independent and adequately trained</b> and have security knowledge; monitor their performance. Small organizations may need external auditors, who must be briefed on the context.</p>
<h4 class="sec">Guidance: conducting the audit</h4>
<p>The <b>audit team leader prepares an audit plan</b> (criteria, scope, methods), considering previous results and open nonconformities; it is kept as documented information. The team reviews: adequacy and effectiveness of processes and controls; achievement of objectives; conformity with clauses 4–10 and the organization's own requirements; <b>consistency of the SoA with the risk assessment and treatment results</b>; consistency of the treatment plan with the assessed risks and acceptance criteria; relevance of management review inputs and outputs and their impact. Good monitoring (9.1) can reduce audit effort.</p><p>For each nonconformity the <b>auditee prepares an action plan</b>, agreed with the audit team leader: the nonconformity, its causes, the short-term correction and long-term corrective action with a time frame, and who is responsible. <b>Audit reports go to senior management</b>; past results are used to adjust the programme toward higher-risk areas.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The standard (9.2.2) adds that the programme includes frequency, methods, responsibilities, planning requirements and reporting; considers the importance of the processes and previous audit results; and that <b>documented information must be available as evidence of the programme's implementation and of the audit results</b>.</p></div>`,
    simple: `<p>The programme is the yearly calendar of audits. The plan is the agenda for one audit. The criteria are the rulebook the auditor checks against.</p>`,
    example: "",
    note: `<p>The deck recommends <b>ISO 19011:2018</b> for detailed guidance on auditing management systems.</p>`,
    pages: "270–282", quote: "audit criteria describe what auditors expect to find.", qp: "272",
    q: { type: "mcq", kind: "Recall", prompt: "What are audit criteria?",
      options: [
        ["The schedule of all audits for the year", false, "That's the audit programme."],
        ["The agenda and arrangements for a single audit", false, "That's the audit plan."],
        ["The set of policies, procedures or requirements that audit evidence is compared against", true, "The course definition."],
        ["The list of nonconformities found", false, "Those are findings."]
      ] } },
  { id: "c9c", clause: "9.2", title: "Audit vocabulary: parties, evidence, findings",
    goal: "Use the core audit terms correctly.",
    body: `<h4 class="sec">Methodology: ISO 19011:2018</h4>
<p>ISO 19011 guides people who manage audit programmes, auditors and audit teams, for internal or external management system audits. Structure: 1 Scope, 2 Normative references, 3 Terms, <b>4 Auditing principles</b>, <b>5 Managing an audit programme</b>, <b>6 Conducting an audit</b>, <b>7 Auditor competence and evaluation</b>, Annex A.</p>
<h4 class="sec">Key terms</h4>
<ul><li><b>Audit</b>: a systematic, independent and documented process for obtaining objective evidence and evaluating it objectively to determine the extent to which audit criteria are met.</li><li><b>First-party</b> audit: internal, by or for the organization itself.</li><li><b>Second-party</b> audit: by parties with an interest in the organization, such as customers auditing a supplier.</li><li><b>Third-party</b> audit: by independent bodies, such as certification or accreditation bodies, or legal and regulatory authorities.</li><li><b>Audit criteria</b>: requirements used as the reference against which objective evidence is compared (policies, procedures, instructions, legal requirements, contracts). With legal criteria, "compliance" or "non-compliance" is used.</li><li><b>Objective evidence</b>: data supporting that something exists or is true, obtained by observation, measurement, testing or other means; usually records, statements of fact or other verifiable information.</li><li><b>Audit findings</b>: the results of evaluating audit evidence against audit criteria. They show conformity or nonconformity and can identify risks, improvement opportunities or good practice.</li><li><b>Audit conclusion</b>: the outcome of the audit after considering the audit objectives and all findings.</li></ul>`,
    simple: `<p>First party = you audit yourself. Second party = your customer audits you. Third party = an independent body audits you. Evidence goes in, findings come out, and the conclusion sums them up.</p>`,
    example: "",
    note: `<p>The course's headings for audit findings and conclusions appear shifted: the "Audit findings" heading gives the ISO 19011 definition of an <i>audit conclusion</i>. This lesson uses the standard terms.</p>`,
    pages: "283–288", quote: "Systematic, independent and documented process for obtaining objective evidence and evaluating it objectively to determine the extent to which audit criteria are met.", qp: "283",
    q: { type: "mcq", kind: "Apply", prompt: "A major customer sends its own team to audit your security against the contract. What type of audit is this?",
      options: [
        ["First-party", false, "First-party audits are done by or for the organization itself."],
        ["Second-party", true, "Done by a party with an interest in the organization, such as a customer."],
        ["Third-party", false, "Third-party audits are done by independent bodies such as certification bodies."],
        ["Management review", false, "Management review is clause 9.3, not an audit."]
      ] } },
  { id: "c9d", clause: "9.3", title: "Management review",
    goal: "Separate management review inputs from outputs.",
    body: `<h4 class="sec">Requirement</h4>
<p>Top management reviews the ISMS at planned intervals to ensure its continuing <b>suitability</b> (alignment with the organization's objectives), <b>adequacy</b> and <b>effectiveness</b> (proper design and integration, and effective processes and controls). Review can happen at several levels, from team meetings to reports, but top management is ultimately responsible.</p>
<h4 class="sec">Guidance</h4>
<p>Top management should require and periodically review ISMS performance reports. The key inputs are the measurement results (9.1), internal audit results (9.2), and the risk assessment results with treatment plan status. Confirm residual risks meet the acceptance criteria and the plan covers all relevant risks.</p><div class="fig"><div class="scroll"><table><thead><tr><th>Agenda (inputs)</th><th>Results (outputs): evidence of decisions on</th></tr></thead><tbody><tr><td>Results of previous reviews · stakeholder feedback · external and internal changes · process performance · nonconformities and corrective actions · monitoring and measurement results · audit results · achievement of objectives · risk assessment results and treatment plan status · opportunities for improvement</td><td>Changes to the security policy and objectives · changes to the risk acceptance criteria and risk assessment criteria · actions following performance evaluation · changes in ISMS resources or budget · an updated risk treatment plan · improvements to monitoring and measurement</td></tr></tbody></table></div></div>
<p>Inputs match the detail management needs. Results include decisions on improvement and any changes to the ISMS. Documented information on reviews is <b>required</b>, and is kept <b>even when no action is decided</b>. Reviews held at several levels should be linked.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The 2022 inputs (9.3.2) include <b>changes in the needs and expectations of interested parties</b> as a separate item, and list the status of actions from previous reviews first.</p></div>`,
    simple: `<p>Leadership looks at the facts (audits, metrics, risks, incidents, feedback) and makes decisions (budget, policy, priorities). Write both down.</p>`,
    example: "",
    pages: "289–292", quote: "The purpose of the management review is to ensure the continuing suitability, adequacy and effectiveness of the ISMS.", qp: "290",
    q: { type: "mcq", kind: "Recall", prompt: "Which of these is an INPUT to management review, not an output?",
      options: [
        ["Internal audit results", true, "Audit results are on the review agenda."],
        ["A decision to increase the ISMS budget", false, "A change in resources or budget is an output."],
        ["An updated risk treatment plan", false, "Listed among the outputs."],
        ["A change to the risk acceptance criteria", false, "Listed among the outputs."]
      ] } }
  ] },

{ id: "clause-10", num: "10", title: "Improvement", phase: "Act", pages: "293–308",
  blurb: "Nonconformities, corrections, corrective actions and continual improvement.",
  cards: [
  { id: "c10a", clause: "10.2", title: "Recognizing a nonconformity",
    goal: "Spot a nonconformity and tell it apart from an incident.",
    body: `<h4 class="sec">Requirement (course 10.1)</h4>
<p>The organization reacts to nonconformities, evaluates them and takes corrective action if necessary.</p>
<h4 class="sec">Explanation</h4>
<p>A <b>nonconformity</b> is the non-fulfilment of an ISMS requirement (a stated, implied or mandatory need or expectation). Types:</p><ol type="a"><li>not meeting an ISO/IEC 27001 requirement, in whole or in part;</li><li>failing to implement or follow a requirement, rule or control set by the ISMS;</li><li>partly or fully failing legal, contractual or customer-agreed requirements.</li></ol><p>Examples: people not following procedures and policies; suppliers not delivering what was agreed; projects not producing results; controls not working as designed. Detected through: deficient activities; ineffective controls not remedied; analysis of incidents; customer complaints; user or supplier alerts; measurements that miss acceptance criteria; objectives not achieved.</p>
<h4 class="sec">Guidance: reacting</h4>
<p>A security <b>incident doesn't necessarily mean a nonconformity</b>, but can indicate one. Audits and complaints are other sources. React through a defined process: identify scope and impact; decide corrections to limit the impact; communicate so they are made; make them; monitor that they worked without side effects; act further if needed; inform other stakeholders. The aim is a managed state. <b>Corrections alone don't prevent recurrence.</b></p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The published 2022 standard numbers this clause <b>10.2</b> (Nonconformity and corrective action) and continual improvement <b>10.1</b>. The course uses the older order.</p></div>`,
    simple: `<p>A nonconformity means a rule (from the standard, your own ISMS, the law or a contract) wasn't met. An incident might reveal one, but not every incident does.</p>`,
    example: "",
    pages: "298–301", quote: "Information security incidents do not necessarily imply that a nonconformity exists, but they can be an indicator of a nonconformity.", qp: "301",
    q: { type: "mcq", kind: "Apply", prompt: "A phishing email reaches inboxes. Staff report it exactly as the procedure says and it is contained in minutes. Is this automatically a nonconformity?",
      options: [
        ["Yes, every incident is a nonconformity", false, "The deck says incidents don't necessarily imply a nonconformity."],
        ["No. An incident isn't automatically a nonconformity, though it's worth analysing", true, "Here the controls and procedure worked as designed."],
        ["Yes, because a control failed to block the email", false, "No control is perfect. The procedure for this case was followed and worked."],
        ["Only if a customer complains", false, "Complaints are one way to find nonconformities, not the definition of one."]
      ] } },
  { id: "c10b", clause: "10.2", title: "Correction versus corrective action",
    goal: "Separate fixing the symptom from removing the cause.",
    body: `<h4 class="sec">Guidance: corrective action</h4>
<p><b>Corrective actions</b> eliminate the <b>cause</b> of a nonconformity and prevent recurrence. They can follow the correction or run in parallel. Steps:</p><ol><li>Decide whether corrective action is necessary, using set criteria.</li><li>Review the nonconformity: similar recorded cases, all consequences and side effects, corrections made.</li><li>Analyse the cause thoroughly.</li><li>Analyse the potential consequences for the ISMS.</li><li>Determine actions to remove the cause, proportional to the consequences and impact.</li><li>Plan them, prioritizing the most likely recurrence and the most significant consequences.</li><li>Implement them as planned.</li><li>Assess whether they removed the cause and prevented related nonconformities.</li></ol>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>Clause 10.2 also asks you to check whether <b>similar nonconformities exist or could occur elsewhere</b>, to <b>change the ISMS if necessary</b>, and to keep <b>documented information as evidence</b> of the nonconformities, the actions taken and the results of corrective action.</p></div>`,
    simple: `<p>Correction: mop the floor. Corrective action: fix the leaking pipe, then check it stays dry.</p>`,
    example: `<p>A former employee's account is still active three weeks after they left. Disabling it today is the <i>correction</i>. Finding out why HR's leaver notice never reached IT, fixing the offboarding process, and checking the next ten leavers is the <i>corrective action</i>.</p>`,
    pages: "301–303", quote: "However, corrections alone will not necessarily prevent recurrence of the nonconformity.", qp: "301",
    q: { type: "mcq", kind: "Apply", prompt: "A former employee's account is still active three weeks after they left. Which of these is the corrective action?",
      options: [
        ["Disable the account today", false, "This is the correction. It limits the impact but doesn't remove the cause."],
        ["Find out why leaver notices don't reach IT, fix the offboarding process, and check it works", true, "This removes the root cause and verifies the fix."],
        ["Email the former employee to ask if they used the account", false, "This may help investigate, but it is neither a correction nor a corrective action."],
        ["Record the incident and close the ticket", false, "Recording alone doesn't address the cause."]
      ] } },
  { id: "c10c", clause: "10.1", title: "Continual improvement",
    goal: "Explain why improvement continues even with no nonconformities.",
    body: `<h4 class="sec">Requirement (course 10.2)</h4>
<p>The organization continually improves the suitability, adequacy and effectiveness of the ISMS.</p>
<h4 class="sec">Explanation</h4>
<p>Organizations and their contexts are never static, and threats evolve quickly. No ISMS is perfect; it can always be improved, even when nothing changes. An assessment may show the ISMS exceeds requirements or lacks efficiency: both are chances to improve. Continual improvement moves the organization from reacting to problems to a proactive approach. Management can set improvement targets (effectiveness, cost, process maturity). The ISMS is a living, learning part of the business; nothing is "forbidden" just because it was good enough before.</p>
<h4 class="sec">Guidance</h4>
<p>Evaluate the ISMS and its elements against internal and external issues (4.1), stakeholder requirements (4.2) and performance results (clause 9). Analyse its <b>suitability</b>, <b>adequacy</b> (do processes and controls fit the organization's purposes and activities?) and <b>effectiveness</b> (are outcomes achieved, requirements met, risks managed, nonconformities handled, with resources proportionate?), and its <b>efficiency</b>. Nonconformities and corrective actions also reveal opportunities. Then, as part of the actions under <b>6.1.1</b>:</p><ol><li>evaluate whether each opportunity is worth pursuing;</li><li>determine the changes to the ISMS;</li><li>plan and implement the actions, making sure benefits are realized;</li><li>evaluate their effectiveness.</li></ol>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>In the published 2022 standard this is clause <b>10.1</b>; the course numbers it 10.2.</p></div>`,
    simple: `<p>Even when nothing is broken, the world around you changes. Keep looking for ways to make the ISMS fit better, work better and cost less.</p>`,
    example: "",
    pages: "304–308", quote: "Finally, no ISMS is perfect; there is always a way it can be improved, even if the organization and its context are not changing.", qp: "305",
    q: { type: "open", kind: "Explain", prompt: "Explain why an ISMS with no open nonconformities still needs continual improvement.",
      answer: `<p>The context and the threats keep changing, so an ISMS that fits today may not fit tomorrow. No ISMS is perfect: an assessment may show it goes beyond requirements or is inefficient, and both are chances to improve. Improvement is driven by 4.1 issues, 4.2 stakeholder requirements and clause 9 results, not only by nonconformities. The goal is to become proactive rather than reactive.</p>` } }
  ] }
];

function renderCase() {
  const answered = Object.keys(caseAns).length;
  const right = Object.entries(caseAns).filter(([k, i]) => CASE[k].o[i][1]).length;
  let h = `<section class="intro"><h2>Case study: Kestrel Freight</h2>
<div class="note"><span class="tag">Illustrative case · not from the deck</span><p>Kestrel Freight is a made-up 150-person logistics company: a head office, two warehouses, an in-house shipment-tracking web service, outsourced payroll, and servers in a third-party data centre. <b>You are its lead implementer.</b> The questions follow the implementation from start to finish. Every answer is explained.</p></div>
<div class="row"><span class="score">${answered} of ${CASE.length} answered · ${right} correct</span><button class="btn" data-act="caseReset">Start over</button></div>`;
  CASE.forEach((c, k) => {
    const a = caseAns[k];
    h += `<div class="qblock"><div class="meta"><span class="chip">Step ${k + 1}</span><span class="chip phase">${c.s}</span></div><p class="prompt">${c.q}</p><div class="opts">` +
      c.o.map((o, i) => {
        let cls = "opt";
        if (a !== undefined) cls += o[1] ? " is-right" : (i === a ? " is-wrong" : " is-dim");
        return `<button class="${cls}" data-act="copt" data-k="${k}" data-i="${i}" ${a !== undefined ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span>${o[0]}</span></button>`;
      }).join("") + `</div>`;
    if (a !== undefined) {
      const ok = c.o[a][1], ri = c.o.findIndex(o => o[1]);
      h += linkPages(`<div class="fb ${ok ? "good" : "bad"}"><span class="tag">${ok ? "Correct" : "Not quite"}</span><p>${c.o[a][2]}</p>${ok ? "" : `<p><b>${LETTERS[ri]}</b> is right: ${c.o[ri][2]}</p>`}</div>`) + `<p class="s">Lesson: ${lessonLink(c.l)}</p>`;
    }
    h += `</div>`;
  });
  return h + `</section>`;
}

/* ---------- Worked examples: filled-in documents for the fictional Kestrel Freight ---------- */
const T = (head, rows) => `<div class="scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const LV = l => `<span class="lv ${l}">${{ L: "Low", M: "Moderate", H: "High", E: "Extreme" }[l]}</span>`;

{ id: "ex-access", title: "Topic-specific policy: access control", phase: "Plan", clause: "5.2 · A.5.15", lessons: ["c5c"],

function exQuestion(e, t, k) {
  const key = e.id + ":" + k, a = exAns[key];
  let h = `<div class="qblock"><div class="meta"><span class="chip">Try it ${e.tryit.length > 1 ? k + 1 : ""}</span><span class="kind">${t.kind}</span></div><p class="prompt">${t.q}</p>`;
  if (t.type === "open") {
    h += `<label class="lbl" for="exta-${key}" style="color:var(--muted)">Your answer (only you see this)</label><textarea id="exta-${key}" placeholder="Write it before you look…"></textarea>`;
    h += a ? `<div class="model"><span class="tag">Model answer</span>${linkPages(t.answer)}</div>` : `<div class="row"><button class="btn primary" data-act="exreveal" data-k="${key}">Show model answer</button></div>`;
    return h + `</div>`;
  }
  h += `<div class="opts">` + t.o.map((o, i) => {
    let cls = "opt";
    if (a !== undefined) cls += o[1] ? " is-right" : (i === a ? " is-wrong" : " is-dim");
    return `<button class="${cls}" data-act="exopt" data-k="${key}" data-i="${i}" ${a !== undefined ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span>${o[0]}</span></button>`;
  }).join("") + `</div>`;
  if (a !== undefined) {
    const ok = t.o[a][1], ri = t.o.findIndex(o => o[1]);
    h += linkPages(`<div class="fb ${ok ? "good" : "bad"}"><span class="tag">${ok ? "Correct" : "Not quite"}</span><p>${t.o[a][2]}</p>${ok ? "" : `<p><b>${LETTERS[ri]}</b> is right: ${t.o[ri][2]}</p>`}</div>`);
  }
  return h + `</div>`;
}

const KEY = "iso27001-guide-v1";
let S = { marks: {}, pos: {}, done: {} };
// Saved progress is untrusted (other pages on the same origin can write it), so keep only known keys and value types.
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const o = JSON.parse(raw) || {};
    const own = (obj, k) => obj && typeof obj === "object" && Object.prototype.hasOwnProperty.call(obj, k);
    MODULES.forEach(m => {
      if (own(o.pos, m.id) && Number.isInteger(o.pos[m.id]) && o.pos[m.id] >= 0 && o.pos[m.id] < m.cards.length) S.pos[m.id] = o.pos[m.id];
      m.cards.forEach(c => {
        if (own(o.marks, c.id) && (o.marks[c.id] === "got" || o.marks[c.id] === "practice")) S.marks[c.id] = o.marks[c.id];
        if (own(o.done, c.id) && o.done[c.id] === true) S.done[c.id] = true;
      });
    });
  }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
