<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-XUY92973qLS0jQTQzvVG4Jr2Cv9IYIHRq+pQdY7xvdU='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>ISO 27001 Lead Implementer Study Guide</title>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap">
<style>
/* Layout: a standards-binder feel. Clause index on the left, one lesson "sheet" at a time on the right. */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --ink: #18222b;
  --muted: #586572;
  --line: #d6dde2;
  --accent: #1b5a70;
  --accent-ink: #ffffff;
  --accent-soft: #e2eef2;
  --quote: #7a5d14;
  --quote-soft: #f7f1e1;
  --gen: #5b4f86;
  --gen-soft: #efedf6;
  --good: #23704a;
  --good-soft: #e3f2ea;
  --warn: #9a4f12;
  --warn-soft: #f8ebdf;
  --r-l: #dcefe3; --r-m: #f6ecc8; --r-h: #f6d9c2; --r-e: #f1c4c4;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --surface: #161d23; --ink: #e2e8ec; --muted: #9ba8b3; --line: #2a343c;
    --accent: #72b6cc; --accent-ink: #0b1418; --accent-soft: #173039;
    --quote: #d8b866; --quote-soft: #2a2414; --gen: #b4a9e0; --gen-soft: #231f35;
    --good: #6cc495; --good-soft: #15291f; --warn: #e6a066; --warn-soft: #2e1f12;
    --r-l: #1d3326; --r-m: #3a3218; --r-h: #43291a; --r-e: #4a1f22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #161d23; --ink: #e2e8ec; --muted: #9ba8b3; --line: #2a343c;
  --accent: #72b6cc; --accent-ink: #0b1418; --accent-soft: #173039;
  --quote: #d8b866; --quote-soft: #2a2414; --gen: #b4a9e0; --gen-soft: #231f35;
  --good: #6cc495; --good-soft: #15291f; --warn: #e6a066; --warn-soft: #2e1f12;
  --r-l: #1d3326; --r-m: #3a3218; --r-h: #43291a; --r-e: #4a1f22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
h1, h2, h3, .display { font-family: var(--display); text-wrap: balance; line-height: 1.2; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 0.82em; }
.lbl { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 40px; padding-block: 32px 64px; }

/* Masthead */
.mast { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.mast h1 { font-size: clamp(1.5rem, 3.2vw, 2.1rem); font-weight: 800; font-stretch: 85%; letter-spacing: -0.01em; }
.mast .std { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 4px; }
.mast .src { font-size: 0.9rem; color: var(--muted); max-width: 40ch; }

/* Clause index */
.index { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; display: flex; flex-direction: column; gap: 2px; }
.index .group { font-family: var(--display); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.index a { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); font-family: var(--display); font-size: 0.92rem; font-weight: 500; }
.index a:hover { background: var(--accent-soft); }
.index a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.index .n { font-family: var(--mono); font-size: 0.8rem; opacity: 0.8; }
.index .p { font-family: var(--mono); font-size: 0.72rem; opacity: 0.75; font-variant-numeric: tabular-nums; }

main { min-width: 0; max-width: 760px; }

/* Lesson sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 22px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font-family: var(--mono); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.chip.clause { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.phase { color: var(--accent); border-color: var(--accent); }
.meta .step { margin-left: auto; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet h2 { font-size: clamp(1.45rem, 3vw, 1.85rem); font-weight: 750; font-stretch: 90%; }
.goal { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-style: italic; }
.goal .lbl { color: var(--accent); font-style: normal; flex: none; }
.explain { display: flex; flex-direction: column; gap: 12px; max-width: 65ch; }
.explain ul, .explain ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.explain b { font-weight: 600; }
.simpler { background: var(--accent-soft); border-radius: 8px; padding: 16px 18px; }
.simpler .lbl { color: var(--accent); display: block; margin-bottom: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 14px; font-family: var(--display); font-size: 0.88rem; font-weight: 600; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }

details.gen, .note { border-radius: 8px; padding: 12px 16px; }
details.gen { border: 1px dashed var(--gen); background: var(--gen-soft); }
details.gen summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 0.92rem; color: var(--gen); }
details.gen[open] summary { margin-bottom: 8px; }
.tag { font-family: var(--display); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
details.gen .tag { color: var(--gen); display: block; margin-bottom: 6px; }
.note { border: 1px dashed var(--line); background: var(--bg); font-size: 0.93rem; }
.note .tag { color: var(--muted); display: block; margin-bottom: 4px; }

/* Check yourself */
.check { border-top: 2px solid var(--ink); padding-top: 18px; display: flex; flex-direction: column; gap: 14px; }
.check h3 { font-size: 1.05rem; font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
.kind { font-family: var(--mono); font-size: 0.72rem; font-weight: 400; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; }
.prompt { font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; cursor: pointer; display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 8px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-family: var(--body); font-size: 0.98rem; line-height: 1.45; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.is-right { border-color: var(--good); background: var(--good-soft); }
.opt.is-wrong { border-color: var(--warn); background: var(--warn-soft); }
.opt.is-dim { opacity: 0.6; }
.fb { border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 0.96rem; }
.fb.good { background: var(--good-soft); }
.fb.bad { background: var(--warn-soft); }
.fb .tag { color: var(--good); }
.fb.bad .tag { color: var(--warn); }
textarea { width: 100%; min-height: 96px; resize: vertical; font: inherit; font-size: 0.96rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.model { background: var(--accent-soft); border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.model .tag { color: var(--accent); }

/* Source block */
.source { border-left: 3px solid var(--quote); background: var(--quote-soft); border-radius: 0 8px 8px 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 0.93rem; }
.source .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.source .lbl { color: var(--quote); }
.source blockquote { margin: 0; font-style: italic; }
.source cite { font-style: normal; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }

.foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; }
.btn.mark-got[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.mark-prac[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

/* Diagrams */
.fig { display: flex; flex-direction: column; gap: 8px; }
.fig .cap { font-size: 0.82rem; color: var(--muted); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { font-family: var(--display); font-weight: 600; font-size: 0.82rem; background: var(--bg); }
.matrix td { text-align: center; font-family: var(--mono); font-weight: 500; min-width: 3.2em; }
.matrix .L { background: var(--r-l); } .matrix .M { background: var(--r-m); } .matrix .H { background: var(--r-h); } .matrix .E { background: var(--r-e); }
.pdca { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.pdca div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.pdca b { font-family: var(--display); font-weight: 700; }
.pdca span { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.pdca .pre { border-style: dashed; }
.scale { display: flex; flex-direction: column; gap: 4px; }
.scale div { display: grid; grid-template-columns: 2em 7.5em minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 6px; background: var(--bg); font-size: 0.93rem; }
.scale .n { font-family: var(--mono); color: var(--accent); }
.scale b { font-family: var(--display); font-weight: 600; }
.pyr { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pyr div { text-align: center; padding: 7px 10px; border-radius: 4px; background: var(--accent-soft); font-family: var(--display); font-size: 0.86rem; font-weight: 600; max-width: 100%; }

/* Home + list views */
.intro { display: flex; flex-direction: column; gap: 18px; }
.intro h2 { font-size: clamp(1.5rem, 3vw, 1.9rem); font-weight: 750; font-stretch: 90%; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.legend > div { border-radius: 8px; padding: 12px 14px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
.legend .l1 { background: var(--quote-soft); border-left: 3px solid var(--quote); }
.legend .l2 { background: var(--gen-soft); border: 1px dashed var(--gen); }
.legend .l3 { background: var(--bg); border: 1px dashed var(--line); }
.legend .l4 { background: var(--gen-soft); border-left: 3px solid var(--gen); } .legend .l4 .tag { color: var(--gen); }
.legend .l1 .tag { color: var(--quote); } .legend .l2 .tag { color: var(--gen); } .legend .l3 .tag { color: var(--muted); }
.modlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.modlist a { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.modlist a:hover { background: var(--accent-soft); }
.modlist .n { font-family: var(--mono); color: var(--accent); }
.modlist .t { font-family: var(--display); font-weight: 600; }
.modlist .d { display: block; font-family: var(--body); font-weight: 400; font-size: 0.88rem; color: var(--muted); }
.modlist .p { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.item .t { font-family: var(--display); font-weight: 600; }
.item .s { font-size: 0.86rem; color: var(--muted); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
.qblock { border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.score { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Implementer panel */
.impl { border: 1px solid var(--accent); border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.impl-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
.impl h3 { font-size: 1rem; font-weight: 700; color: var(--accent); }
.impl .tag { color: var(--muted); }
.impl dl { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.impl dl > div { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 14px; }
.impl dt { font-family: var(--display); font-weight: 600; font-size: 0.85rem; color: var(--muted); padding-top: 2px; }
.impl dd { margin: 0; font-size: 0.95rem; }
.impl .trap dt { color: var(--warn); }
a.pg { text-decoration-style: dotted; }
.badge { display: inline-block; font-family: var(--display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; border: 1px solid; white-space: nowrap; }
.badge.req { color: var(--good); border-color: var(--good); }
.badge.need { color: var(--muted); border-color: var(--line); }
.badge.bg { color: var(--gen); border-color: var(--gen); border-style: dashed; }
.legend3 { font-size: 0.86rem; color: var(--muted); line-height: 2; }
.flow { display: flex; flex-direction: column; }
.flow .st { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg); font-size: 0.95rem; }
.flow .ar { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); padding: 4px 0 4px 18px; }
.phase-sec { display: flex; flex-direction: column; gap: 6px; }
.phase-sec h3 { font-size: 1.1rem; font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.phase-sec h3 .mono { color: var(--accent); }
.phase-sec .sub { font-family: var(--mono); font-size: 0.75rem; font-weight: 400; color: var(--muted); }
.pbrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.93rem; }
.pbrow > span { min-width: 0; }
.pbrow b { font-family: var(--display); font-weight: 600; display: block; }
.pbrow .s, .qblock + .s, p.s { display: block; font-size: 0.82rem; color: var(--muted); }
.pbhead { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.role { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.role h3 { font-size: 1rem; font-weight: 700; }
.role ul { margin: 0; padding-left: 1.1em; font-size: 0.92rem; display: flex; flex-direction: column; gap: 4px; }
.traps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.pref { color: var(--muted); white-space: nowrap; }
.terms { margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.terms > div { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr); gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.terms dt { font-family: var(--display); font-weight: 600; }
.terms dd { margin: 0; font-size: 0.95rem; }
.ml { display: none; font-family: var(--display); font-weight: 600; color: var(--muted); font-size: 0.82rem; }
/* Worked examples */
.exgroup { font-family: var(--display); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 14px 4px 4px; border-bottom: 1px solid var(--line); }
.exfacts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.exfacts > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.exfacts dt { font-family: var(--display); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.exfacts dd { margin: 2px 0 0; font-size: 0.92rem; }
.tagline { font-size: 0.88rem; color: var(--muted); }
.tagline .tag { color: var(--gen); margin-right: 6px; }
.exdoc { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--gen); border-radius: 6px; display: flex; flex-direction: column; }
.exrow { display: grid; grid-template-columns: minmax(0, 1fr) 15em; border-bottom: 1px solid var(--line); }
.exrow:last-child { border-bottom: 0; }
.exrow .part { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; font-size: 0.95rem; }
.exrow .part h4 { margin: 0; font-family: var(--display); font-size: 0.98rem; font-weight: 700; }
.exrow .part ul, .exrow .part ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; }
.exrow .why { padding: 16px 16px; background: var(--quote-soft); border-left: 1px solid var(--line); font-size: 0.86rem; display: flex; flex-direction: column; gap: 4px; }
.exrow .why .tag { color: var(--quote); }
.exrow table { font-size: 0.84rem; }
.lv { font-family: var(--mono); font-size: 0.75rem; padding: 1px 6px; border-radius: 4px; white-space: nowrap; color: var(--ink); }
.lv.L { background: var(--r-l); } .lv.M { background: var(--r-m); } .lv.H { background: var(--r-h); } .lv.E { background: var(--r-e); }
.sig { display: inline-block; margin-top: 6px; font-family: var(--mono); font-size: 0.82rem; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bars > div { display: grid; grid-template-columns: 11em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 0.88rem; }
.bar { position: relative; height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.impl .exl dt { color: var(--gen); }
@media (max-width: 760px) {
  .exrow { grid-template-columns: minmax(0, 1fr); }
  .exrow .why { border-left: 0; border-top: 1px dashed var(--line); }
  .bars > div { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
.route { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }

<script>
const MODULES = [
{ id: "foundations", num: "1", title: "Foundations", phase: "", pages: "19–32",

  cards: [
  { id: "f1", clause: "", title: "What an ISMS is",
    goal: "Define an ISMS and explain what it does for an organization.",
    body: `<h4 class="sec">1.1 Information and general principles</h4>
<p>An ISMS (information security management system) is a set of <b>policies, procedures, guidelines, resources and associated activities</b>, managed together by an organization.</p><p>It is a <b>systematic approach to establish, implement, operate, monitor, review, maintain and improve</b> an organization's information security to achieve business objectives. It protects information assets with adequate controls.</p><p>The ISMS links to <b>ISO 27005</b>, which describes the information security risk process: establishing the context, then identifying, estimating, assessing, evaluating, treating and accepting risk.</p>
<h4 class="sec">What an ISMS contributes to an organization</h4>
<ol type="a"><li>Organizational awareness of the need for information security.</li><li>Assignment of information security responsibilities.</li><li>Commitment of senior management.</li><li>Consideration of stakeholders' needs and requirements.</li><li>Risk management to choose controls that reach acceptable risk levels.</li><li>Information security as an essential part of processes.</li><li>Active prevention and detection of security incidents.</li><li>The capacity to comply.</li><li>Continuous process improvement through information security.</li></ol>
<h4 class="sec">1.3 The management system</h4>
<p>A management system uses a framework of resources to achieve the organization's objectives. It includes organizational structure, policies, planning, responsibilities, practices, procedures, processes and resources. For information security it lets an organization:</p><ol type="a"><li>meet the security requirements of customers and other stakeholders;</li><li>improve its plans and activities;</li><li>meet its information security objectives;</li><li>comply with regulations, laws and sector obligations;</li><li>manage information assets in an organized way that supports continuous improvement and adapts to its goals and environment.</li></ol>`,
    simple: `<p>An ISMS is the organization's "way of running" security: the rules, owners and routines that decide what to protect, how to protect it, and how to keep getting better at it. Tools like firewalls are only one part of it.</p>`,
    example: `<p>A 40-person accounting firm has antivirus and nightly backups, but nobody has decided which client data matters most, who owns it, or whether the backups actually restore. An ISMS adds those decisions, named owners and a regular review cycle around the tools the firm already has.</p>`,
    pages: "21–22", quote: "An ISMS is a systematic approach to establish, implement, operate, monitor, review, maintain and improve an organization's information security to achieve business objectives.", qp: "21",
    q: { type: "mcq", kind: "Recall", prompt: "Which description best matches an ISMS as the deck defines it?",

        ["A one-time audit that certifies the organization as secure", false, "An ISMS is ongoing. It is maintained and continually improved, not done once."],
        ["A list of the 93 Annex A controls", false, "Annex A is a reference list of controls. The ISMS is the management system that selects and runs them."]

  { id: "f2", clause: "", title: "Confidentiality, integrity, availability",
    goal: "Tell the three core properties of information security apart.",
    body: `<h4 class="sec">1.2 Information security</h4>
<p>Information security has three dimensions, defined in ISO 27000:</p><ul><li><b>Confidentiality</b>: information is not made available or disclosed to unauthorized parties.</li><li><b>Integrity</b>: the accuracy and completeness of assets are safeguarded.</li><li><b>Availability</b>: information is accessible and usable on request by authorized parties.</li></ul>
<h4 class="sec">How it is achieved</h4>
<p>Information security is achieved by implementing applicable requirements and <b>controls selected through the risk management process</b> of an ISMS. Controls take the form of policies, processes, procedures, organizational structures, software and hardware.</p><p>Controls must be specified, implemented, monitored, reviewed and improved where needed, so security and business objectives are met. They should be integrated with the organization's business processes.</p>`,
    simple: `<p><b>Confidentiality</b>: only the right people can see it. <b>Integrity</b>: it is correct and complete. <b>Availability</b>: it is there when the right people need it.</p>`,
    example: `<p>A clinic's appointment system. A leaked patient list is a confidentiality failure. A wrong medication dosage saved in a record is an integrity failure. The system being down on a Monday morning is an availability failure.</p>`,
    pages: "23–24", quote: "Information security is achieved by implementing a set of applicable requirements and controls, selected through the risk management process by means of an ISMS", qp: "24",
    q: { type: "mcq", kind: "Apply", prompt: "A storage failure takes a hospital's patient-records server offline for six hours. No data is lost, changed or exposed. Which property was affected?",
      options: [
        ["Confidentiality", false, "Nothing was disclosed to anyone unauthorized."],
        ["Integrity", false, "The records stayed accurate and complete."],
        ["Availability", true, "Authorized staff could not access or use the information when they needed it."],
        ["None of them, because no data was lost", false, "Being unable to reach information on request is itself a loss of availability."]
      ] } },
  { id: "f3", clause: "", title: "What makes an ISMS succeed",
    goal: "Name the critical success factors and the benefits of an ISMS.",
    body: `<h4 class="sec">1.4 Critical success factors</h4>
<ol type="a"><li>Security policy, objectives and activities aligned with business objectives.</li><li>An approach and framework for designing, implementing, monitoring, maintaining and improving security that fits the organization's culture.</li><li>Visible support and commitment from all levels of management, especially senior management.</li><li>Knowledge of asset protection requirements, gained through information security risk management (ISO 27005).</li><li>An effective awareness, training and education programme that tells everyone their security responsibilities.</li><li>An effective information security incident management process.</li><li>An effective approach to business continuity management.</li><li>A measurement system that evaluates security management performance and suggests improvements.</li></ol><p>An ISMS makes it more likely the organization consistently achieves these factors.</p>
<h4 class="sec">1.5 Benefits of an ISMS</h4>
<p>Mainly a reduction of information security risk, by contributing:</p><ol type="a"><li>an aid to management in structuring its approach to security;</li><li>corporate risk governance, education and training;</li><li>promotion of globally accepted best practices;</li><li>a common language for information security;</li><li>competitiveness through ISO/IEC 27001 certification by an <b>accredited</b> certification body;</li><li>more stakeholder trust in the organization;</li><li>effective management of security investment.</li></ol>`,
    simple: `<p>An ISMS works when leaders visibly back it, it fits how the business already works, people are trained, and results are measured. It pays off in trust, clearer spending and a shared language.</p>`,
    example: `<p>Two firms buy the same security tools. In the first, the CEO opens every quarterly security review and budgets for training. In the second, security is "IT's thing". The deck's success factors predict the first firm will get far more from the same tools.</p>`,

    q: { type: "mcq", kind: "Recall", prompt: "Which of these does the deck list as a critical success factor?",

        ["Buying the most advanced security tools available", false, "Tools are not on the list. The factors are about alignment, leadership, risk understanding, training, incidents, continuity and measurement."],

        ["Giving the IT department sole responsibility for security", false, "The deck stresses responsibilities across the organization, with top management keeping overall responsibility."],
        ["Achieving certification within three months", false, "Speed of certification is not a success factor in the deck."]

  { id: "f4", clause: "", title: "How ISO/IEC 27001:2022 is organized",
    goal: "Find your way around the standard, Annex A and its companion documents.",
    body: `<h4 class="sec">1.6 The ISO/IEC 27001 family</h4>
<ul><li><b>ISO/IEC 27001:2022</b>: the requirements (clauses 4–10) and <b>Annex A</b> with 93 controls.</li><li><b>ISO/IEC 27003:2017</b>: the ISMS guide, explaining the requirements. Most "Explanation" and "Guidance" slides in the course come from it.</li><li><b>ISO/IEC 27002:2022</b>: the guide to information security controls.</li></ul>
<h4 class="sec">Structure of ISO/IEC 27001:2022</h4>
<p>Clauses 1 Purpose and scope, 2 Normative references, 3 Terms and definitions, then the requirements: 4 Context of the organization, 5 Leadership, 6 Planning, 7 Support, 8 Operation, 9 Performance evaluation, 10 Improvement.</p><p>Clauses 4–10 follow <b>Annex SL</b>, the high-level structure: simple shared language and identical statements for identical requirements, so organizations can integrate different management systems.</p>
<h4 class="sec">1.7 ISO 27002:2022</h4>
<p>A reference set of generic controls with guidance, for use: (a) within an ISMS based on ISO/IEC 27001; (b) to implement controls based on international best practice; (c) to develop organization-specific guidelines. Its title changed from "Code of practice for information security controls" to "Information security, cybersecurity and privacy protection — Information security controls".</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>Two points the course doesn't state: excluding any requirement in <b>clauses 4–10 is not acceptable</b> when claiming conformity (clause 1), and the order of the clauses <b>doesn't set the order of implementation</b> (introduction).</p></div>`,

<tr><td class="mono">A.5</td><td>Organizational</td><td>37</td></tr>
<tr><td class="mono">A.6</td><td>People</td><td>8</td></tr>
<tr><td class="mono">A.7</td><td>Physical</td><td>14</td></tr>
<tr><td class="mono">A.8</td><td>Technological</td><td>34</td></tr>
<tr><th colspan="2">Total</th><th>93</th></tr></tbody></table></div>
<p class="cap">Reconstructed from a course diagram.</p></div>`,
    simple: `<p>Clauses 4–10 tell you what your management system must do. Annex A is a menu of 93 controls in four groups. ISO 27002 explains the controls; ISO 27003 explains the clauses.</p>`,

        ["93 controls in 4 themes", true, "Organizational 37, People 8, Physical 14, Technological 34."],
        ["93 controls in 7 themes, one per clause 4–10", false, "Clauses 4–10 are the management system requirements, not Annex A themes."],
        ["37 controls in 4 themes", false, "37 is the size of the Organizational theme alone."]

  cards: [
  { id: "r1", clause: "", title: "PDCA mapped to the clauses",
    goal: "Place each clause of the standard in the Plan–Do–Check–Act cycle.",
    body: `<h4 class="sec">2.1 Navigation route</h4>
<p>The course's route starts with a <b>diagnosis</b> and a <b>business case</b>, then runs the Deming <b>PDCA cycle</b> (Plan, Do, Check, Act).</p>
<h4 class="sec">2.2 PDCA and the clauses of ISO/IEC 27001:2022</h4>
<ul><li><b>Plan</b>: 4 Context (organization and its context, stakeholder expectations, ISMS scope, ISMS); 5 Leadership (leadership and commitment, policy, roles); 6 Planning (actions on risks and opportunities, risk assessment, risk treatment, objectives, change planning); 7 Support (resources, competence, awareness, communication, documented information).</li><li><b>Do</b>: 8 Operation (operational planning and control, risk assessment, risk treatment).</li><li><b>Check</b>: 9 Performance evaluation (monitoring and measurement, internal audit, management review).</li><li><b>Act</b>: 10 Improvement (nonconformities and corrective actions, continual improvement).</li></ul>
<h4 class="sec">2.3 PDCA applied to ISMS implementation</h4>
<div class="fig"><div class="scroll"><table><thead><tr><th>Phase</th><th>Implementation activities in the course</th></tr></thead><tbody><tr><td><b>Plan</b></td><td>Project agreement · gap analysis · process mapping · asset inventory · risk analysis · policy approval · Statement of Applicability approval</td></tr><tr><td><b>Do</b></td><td>Implementation of procedures · training and awareness · record collection</td></tr><tr><td><b>Check</b> (verify)</td><td>Monitoring and audit</td></tr><tr><td><b>Act</b></td><td>Improvement</td></tr></tbody></table></div><p class="cap">Reconstructed from the course diagram "PDCA applied to ISMS implementation".</p></div>

<p>So the risk analysis and the treatment decisions are made in <b>Plan</b>; Do carries them out. In the course's words, the organization "executes the risk assessment process established in the Planning phase".</p>`,

<p class="cap">Built from the course's module objectives.</p></div>`,
    simple: `<p>Plan the system (clauses 4–7), run it (8), check it (9), fix and improve it (10). Then go around again.</p>`,

    goal: "Recall the order of implementation steps and the output of each.",
    body: `<h4 class="sec">2.5 General implementation steps</h4>
<p>The course gives 16 steps. Steps 1–3 are the diagnosis and business case; steps 4–16 run through PDCA. Each step's output feeds the next.</p><ol><li>Management support: <i>business case</i>.</li><li>Identify requirements: analysis of the existing system, <i>diagnosis (gap analysis)</i>.</li><li>Create the project: <i>project plan (action plan)</i>.</li><li>Scope and objectives of the management system: <i>ISMS scope, objectives</i>.</li><li>Create the information security policy: <i>ISMS policy</i>.</li><li>Risk process: <i>risk assessment methodology</i>.</li><li>Risk assessment and treatment: <i>risk assessment report</i>.</li><li>Define the controls to implement: <i>Statement of Applicability (SoA)</i>.</li><li>Who will implement the controls: <i>risk treatment plan</i>.</li><li>Measure effectiveness: <i>measurement methodology</i>.</li><li>Implement support controls and procedures.</li><li>Implement training and awareness programmes.</li><li>Monitor the ISMS: <i>records</i>.</li><li>Internal audit: <i>audit reports, corrective actions</i>.</li><li>Management review.</li><li>Continual improvement: <i>improvement methodologies and frameworks</i>.</li></ol>`,

  { id: "r3", clause: "", title: "Implementation phases in ISO 27003",
    goal: "Explain why management approval comes first.",
    body: `<h4 class="sec">2.4 ISMS implementation according to ISO 27003</h4>
<p>The course shows the ISO 27003 project phases, each with its output:</p><div class="fig"><div class="scroll"><table><thead><tr><th>Phase</th><th>Output</th></tr></thead><tbody><tr><td>Obtain approval to start the ISMS project</td><td>Management approval to initiate the project</td></tr><tr><td>Define the ISMS scope, boundaries and policy</td><td>Limits and scope of the ISMS; ISMS policy</td></tr><tr><td>Analyse information security requirements</td><td>Information security requirements; assessment results</td></tr><tr><td>Risk assessment and planning</td><td>Risk treatment plan; approval to implement the ISMS</td></tr><tr><td>Design the ISMS</td><td>Final ISMS implementation plan</td></tr></tbody></table></div></div>

<h4 class="sec">Activities</h4>

<h4 class="sec">2.6 Final overview</h4>
<p>The course's overview diagram links the outputs in sequence: approval to start → business case approved → scope and policy → gap analysis results and inventory of information assets → risk analysis and risk assessment report → risk treatment plan and selection of controls → ISMS design and implementation plan → procedures and document control → measurement.</p>`,

{ id: "gap", num: "3", title: "Business case and gap analysis", phase: "Diagnosis", pages: "43–55",

  cards: [
  { id: "g1", clause: "", title: "The business case",
    goal: "Name the five parts of a business case and what each answers.",
    body: `<h4 class="sec">3.1 Business case</h4>
<p>"A document that defines the proposal, sets out its objectives, deliverables, estimated cost and effort, and scope" (Tom Mochal). For an ISMS it summarizes, <b>for top management</b>, the main aspects to consider before implementing.</p>
<h4 class="sec">3.2 Parts of a business case</h4>
<div class="fig"><div class="scroll"><table><thead><tr><th>Part</th><th>Content</th></tr></thead><tbody><tr><td>Executive summary</td><td>The business problem the project solves · how it benefits the business · how it aligns with strategic needs</td></tr><tr><td>Opportunity analysis</td><td>Internal and external context in terms of information security · key stakeholder needs · relevant legal needs for the sector</td></tr><tr><td>Cost–benefit analysis</td><td>Quantified costs and benefits · return on investment · proposed scenarios</td></tr><tr><td>Risk and reward analysis</td><td>The most relevant internal and external risks in the industry that call for an ISMS, and their likely cost if they happen</td></tr><tr><td>Implementation plan</td><td>Activities, time, resources, goals (compliance measures, quality of progress, budget)</td></tr></tbody></table></div></div>`,
    simple: `<p>It's a pitch to leadership: here is the problem, here is what it costs, here is what we gain, here is what happens if we don't act, and here is the plan.</p>`,
    example: `<p>An online retailer's business case points to a new contract requirement from a large customer (opportunity), estimates EUR 80k over 12 months against the value of that contract (cost–benefit), and estimates the cost of a card-data breach in its sector (risk and reward).</p>`,
    pages: "45–48", quote: "Document that summarizes to the Top Management the main aspects to take into account to implement an Information Security Management System (ISMS).", qp: "46",
    q: { type: "mcq", kind: "Apply", prompt: "The CFO asks: \"What will this cost, and what do we get back?\" Which part of the business case answers that?",
      options: [
        ["Executive summary", false, "It gives the overview, problem and strategic fit, not the detailed numbers."],
        ["Opportunity analysis", false, "This covers context, stakeholder needs and legal needs."],
        ["Cost–benefit analysis", true, "It details quantifiable costs and benefits, return on investment and scenarios."],
        ["Risk and reward analysis", false, "This covers industry risks and their likely cost, not the project's own return."]
      ] } },
  { id: "g2", clause: "", title: "Gap analysis",
    goal: "Explain what a gap analysis measures and why you run it.",
    body: `<h4 class="sec">3.3 Gap analysis</h4>
<p>A gap analysis checks compliance with <b>both</b> the ISO/IEC 27001:2022 requirements and its <b>Annex A</b> controls. It shows the current situation, the desired situation, and the key steps to close the gap: the <b>action plan</b>. It is also called a <b>compliance assessment</b> or <b>pre-assessment</b>, and gives a high-level overview of the current security posture.</p>
<h4 class="sec">3.4 Objectives</h4>
<ul><li>Establish the starting point and the effort needed, as a reliable basis for the implementation plan.</li><li>Keep a tool to measure how far implementation has progressed during the project.</li></ul>
<h4 class="sec">3.6 How to perform it</h4>
<p>Use a maturity model. For each requirement and control, ask a series of questions (a <b>compliance test</b>). The answers place the organization on the model's scale. Design the questions carefully from the standard and its Annex A, as two tests: one for the clauses and one for Annex A.</p>`,
    simple: `<p>Where are we now, where do we need to be, and what's in between? Then you re-run it to see your progress.</p>`,
    example: "",
    pages: "49–53", quote: "A GAP analysis consists of an analysis of compliance with both the requirements of ISO IEC 27001:2022 and its controls (Annex A).", qp: "49",
    q: { type: "mcq", kind: "Recall", prompt: "What does a gap analysis assess the organization against?",
      options: [
        ["Only the Annex A controls", false, "It also covers the clause 4–10 requirements."],
        ["The ISO 27001 requirements and the Annex A controls", true, "Both, as the course states."],
        ["Competitors' security posture", false, "It compares your current state with your target state, not with competitors."],
        ["Only legal and regulatory obligations", false, "Those inform the context, but the gap analysis is against ISO 27001 and Annex A."]
      ] } },
  { id: "g3", clause: "", title: "Maturity models: the COBIT scale",
    goal: "Place a process on the COBIT maturity scale.",
    body: `<h4 class="sec">3.5 Maturity models</h4>
<p>A maturity model is a structure of elements describing how mature an entity is in a given aspect, on a scale of 4, 5 or 6 levels. It tells you where you are today, where you need to be, what to do to get there, and helps manage growth.</p><p>Models named in the course: <b>COBIT</b>, CMMI, NIST CSEAT, CITI ISEM, CERT/CSO and ISM3.</p>
<h4 class="sec">3.7 COBIT maturity model</h4>
<p>The course uses COBIT to score each requirement (clause) and control (Annex A). Each is plotted with three markers: the company's <b>current status</b>, the <b>industry average</b>, and the company's <b>target</b>.</p>`,
    diagram: `<div class="fig"><div class="scale">
<div><span class="n">0</span><b>Doesn't exist</b><span>Process management is not applied.</span></div>
<div><span class="n">1</span><b>Initial</b><span>Processes are ad hoc and disorganized.</span></div>
<div><span class="n">2</span><b>Repeatable</b><span>Processes follow a regular pattern.</span></div>
<div><span class="n">3</span><b>Defined</b><span>Processes are documented and communicated.</span></div>
<div><span class="n">4</span><b>Managed</b><span>Processes are monitored and measured.</span></div>
<div><span class="n">5</span><b>Optimized</b><span>Good practices are used and automated.</span></div></div>
<p class="cap">Level names and descriptions from the course diagram, matched to levels by order.</p></div>`,
    simple: `<p>0 = nothing. 1 = chaos. 2 = a habit. 3 = written down and shared. 4 = measured. 5 = optimized and automated.</p>`,
    example: "",
    pages: "51–54", quote: "it allows us to evaluate the current maturity level with respect to the requirements (Numerals) and controls (Annex A) of ISO IEC 27001 on a scale of 5 levels", qp: "54",
    q: { type: "mcq", kind: "Apply", prompt: "User access reviews are written in a procedure and staff were told about it, but nobody tracks whether the reviews happen. Which COBIT level fits best?",
      options: [
        ["2 Repeatable", false, "It is already documented and communicated, which is beyond a regular pattern."],
        ["3 Defined", true, "It is documented and communicated, but not yet monitored or measured."],
        ["4 Managed", false, "Level 4 needs the process to be monitored and measured, which is missing here."],
        ["5 Optimized", false, "Nothing suggests automation or optimized good practice."]
      ] } },
  { id: "g4", clause: "", title: "Project vision and action plan",
    goal: "List what goes into the ISMS action plan.",
    body: `<h4 class="sec">3.9 Project vision and action plan</h4>
<p>Once the gap analysis is done, an action plan starts the implementation. The ISMS begins as a <b>project</b> and must then be maintained and improved in operation.</p><p>The action plan may contain:</p><ul><li>Objective, scope and users.</li><li>Reference documents.</li><li>The ISMS implementation project: objective, results and timeline.</li><li>Project organization: <b>project sponsor, project manager, project team</b>.</li><li>Main risks of the plan.</li><li>Tools for implementation and reporting.</li><li>Records management.</li><li>Validity and document management.</li></ul>`,
    simple: `<p>Treat it like any project: a goal, a timeline, a sponsor, a manager, a team, known risks and a way to report progress.</p>`,
    example: "",
    pages: "55", quote: "The implementation of the system should be seen as a project initially, which should then be maintained and improved in operation.", qp: "55",
    q: { type: "open", kind: "Recall", prompt: "Without looking: name the three roles in the action plan's project organization.",
      answer: `<p><b>Project sponsor, project manager and project team</b>.</p>` } }
  ] },

{ id: "clause-4", num: "4", title: "Context of the organization", phase: "Plan", pages: "56–91",
  blurb: "Internal and external issues, stakeholders, and setting the ISMS scope.",
  cards: [
  { id: "c4a", clause: "4.1", title: "Internal and external issues",
    goal: "Classify issues as internal or external and say why you analyse them.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization determines the external and internal issues that are relevant to its purpose and affect its ability to achieve the expected results of the ISMS.</p>
<h4 class="sec">Explanation</h4>
<p>The organization continually analyses itself and the world around it. The analysis has <b>three purposes</b>: understand the context to decide the ISMS scope; analyse the context to find risks and opportunities; keep the ISMS adapted to changing issues.</p><p><b>External issues</b> are outside the organization's control (its environment): social and cultural; technological; political, legal, normative and regulatory; financial and macroeconomic; competitive. Examples: the legal implications of using an outsourced IT service; exposure to fires, floods and earthquakes; advances in hacking tools and cryptography; general demand for the organization's services.</p><p><b>Internal issues</b> are under its control: organizational culture; policies, objectives and strategies; governance, structure, roles and responsibilities; standards, guidelines and adopted models; information systems, information flows and decision-making; processes and procedures; physical infrastructure and environment; previous audits and risk assessment results; capabilities in resources and knowledge.</p>
<h4 class="sec">Guidance</h4>
<p>The results are used in clauses <b>4.3, 6.1 and 9.3</b>. Starting from the organization's purpose (mission, business plan) and the ISMS's intended outcomes, review the environment and ask: how does each category work, and which issues affect the security objectives?</p><ul><li><b>Governance and structure</b>: model the ISMS on existing management systems and combine common functions such as management review and audit.</li><li><b>Policies, objectives and strategies</b>: show what the organization aims for; align security objectives with business objectives.</li><li><b>Information systems and flows</b>: identify the flows between systems in enough detail.</li></ul><p>Issues change over time, so review them and their influence on scope, constraints and requirements periodically. Documented information is needed only as far as the organization finds it necessary.</p>
<h4 class="sec">Methodology</h4>
<p>Tools for the analysis: <b>SWOT</b> (strengths and weaknesses are internal; opportunities and threats are external) and <b>PESTLE</b> (political, economic, social, technological, legal, ecological), used to find the external issues affecting the ISMS.</p>`,
    simple: `<p>Look outside (laws, technology, the economy, competitors, nature) and inside (culture, systems, structure, skills). Ask which of these could help or hurt your security goals.</p>`,
    example: `<p>For a regional bank, an external issue is a new national data-breach notification law. An internal issue is that its core banking system runs on an unsupported operating system.</p>`,
    pages: "61–69", quote: "External issues are those that are outside the control of the organization.", qp: "64",
    q: { type: "mcq", kind: "Apply", prompt: "Which of these is an external issue?",
      options: [
        ["Staff have had no security training", false, "Training and capability are internal issues the organization controls."],
        ["A new data protection law in a country where you sell", true, "Legal and regulatory changes are outside the organization's control."],
        ["How the organization makes decisions", false, "Governance and decision-making are internal issues."],
        ["The results of last year's risk assessment", false, "Previous audits and risk assessments are listed as internal issues."]
      ] } },
  { id: "c4b", clause: "4.2", title: "Interested parties (stakeholders)",
    goal: "Identify the relevant stakeholders and their security requirements.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization determines the stakeholders relevant to the ISMS and their requirements relevant to information security.</p>
<h4 class="sec">Explanation</h4>
<p>A <b>stakeholder</b> is a person or organization that can affect, be affected by, or perceive itself to be affected by a decision or activity of the organization. Stakeholders can be inside or outside and may have specific security needs, expectations and requirements.</p><ul><li><b>Internal</b>: decision-makers including senior management; process, system and information owners; support functions such as IT or HR; employees and users; information security professionals.</li><li><b>External</b>: regulators and legislators; shareholders, owners and investors; suppliers, subcontractors, consultants and outsourcing partners; industry associations; competitors; customers and consumers; activist groups.</li></ul>
<h4 class="sec">Guidance</h4>
<ol><li>Identify external stakeholders.</li><li>Identify internal stakeholders.</li><li>Identify stakeholder needs.</li></ol><p>Needs change over time, so review them and their influence on scope, constraints and requirements periodically. Documented information is needed only as far as the organization finds it necessary.</p>
<div class="stdchk"><span class="tag">Checked against ISO/IEC 27001:2022</span><p>The 2022 text adds a third point: determine <b>which of these requirements will be addressed through the ISMS</b> (4.2 c). It also notes that requirements can include legal and regulatory requirements and contractual obligations.</p></div>`,
    simple: `<p>Make a list of who cares about your security, inside and outside. Write down what each of them expects, and check the list again from time to time.</p>`,
    example: `<p>A payroll provider: customers expect confidentiality of salary data; the tax authority expects accurate, on-time filings (integrity, availability); its cloud host expects contract terms to be followed.</p>`,
    pages: "70–74", quote: "Stakeholder is a term that refers to individuals or organizations that may affect or be affected or perceived to be affected by a decision or activity of the organization.", qp: "71",
    q: { type: "mcq", kind: "Recall", prompt: "Which of these is NOT on the deck's list of external stakeholders?",
      options: [
        ["Regulators and legislators", false, "External."],
        ["Competitors", false, "External."],
        ["Process, system and information owners", true, "These are internal stakeholders."],
        ["Activist groups", false, "External."]
      ] } },
  { id: "c4c", clause: "4.3", title: "What the scope must consider",
    goal: "Decide what has to be considered when setting the ISMS boundary.",
    body: `<h4 class="sec">Requirement</h4>
<p>The organization determines the boundaries and applicability of the ISMS to establish its scope.</p>
<h4 class="sec">Explanation</h4>
<p>The scope defines <b>where and for what</b> the ISMS applies, and where it does not. It is the foundation for every other implementation activity. You need precise knowledge of the boundaries and of the <b>interfaces and dependencies</b> with other organizations, because changing the scope later costs considerable effort and money.</p><p>Factors that may affect the scope:</p><ol type="a"><li>the external and internal issues from 4.1;</li><li>the stakeholders and their requirements from 4.2;</li><li>the business activities to be covered by the ISMS;</li><li>all support functions: human resources; IT services; software applications; buildings and physical areas; critical services whose loss of confidentiality, integrity or availability would have a major impact; the limits of ICT;</li><li>all functions outsourced to other parts of the organization or to independent suppliers.</li></ol><p>A scope can be one or more processes, functions, services, sections or locations; an entire legal entity; or an administrative entity plus one or more of its suppliers.</p>`,
    simple: `<p>Draw a clear line around what you're protecting. Include the things it depends on (people, IT, buildings, suppliers), or say clearly where the line sits and why.</p>`,
    example: `<p>A software company certifies only its SaaS product. The product depends on HR onboarding (access is granted there) and on a third-party data centre. Both are interfaces the scope must address, even if they sit outside the boundary.</p>`,
    pages: "75–78", quote: "The scope defines where and for what exactly the ISMS is applicable and where and for what it is not.", qp: "76",
    q: { type: "mcq", kind: "Apply", prompt: "A company wants to scope only its cloud hosting service. The service depends on HR onboarding and an outsourced data centre. What does 4.3 expect?",
      options: [
        ["Ignore HR and the data centre, since they are outside the service", false, "Support functions and outsourced functions are explicitly listed as factors to consider."],
        ["Consider those dependencies and identify the interfaces when setting the boundary", true, "The scope must consider support functions, outsourced functions and their interfaces."],
        ["Scope the whole company, because partial scopes are not allowed", false, "A scope can be a single service or process."],
        ["Exclude them; exclusions need no justification", false, "The deck's method asks for a justification of any exclusions."]
      ] } },
  { id: "c4d", clause: "4.3–4.4", title: "How to set and document the scope",
    goal: "Follow the multi-stage scoping method and the three scope dimensions.",
    body: `<h4 class="sec">Guidance: a multi-stage approach</h4>
<div class="fig"><div class="scroll"><table><thead><tr><th>Stage</th><th>What happens</th></tr></thead><tbody><tr><td>Preliminary scope</td><td>Set by a small but representative group of management representatives</td></tr><tr><td>Enhanced (refined) scope</td><td>Review functional units inside and outside the preliminary scope; include or exclude some to reduce the interfaces along the boundary</td></tr><tr><td>Final scope</td><td>Evaluated by all management within the refined scope, adjusted if needed, then described accurately</td></tr><tr><td>Scope approval</td><td>The documented scope is formally approved by top management</td></tr></tbody></table></div></div>
<p>Also consider activities that affect the ISMS and outsourced activities, and identify their physical, technical and organizational interfaces. The documented scope should include: the organization's scope, boundaries and interfaces; the ICT scope, limits and interfaces; and the physical scope, limits and interfaces.</p>
<h4 class="sec">Methodology</h4>
<p><b>ISMS scope = organizational scope + physical scope + technological scope</b>, defined in terms of the business, the organization, its location, assets and technology. Build each dimension from the process and structure descriptions, the locations and physical layout, and the technology diagrams, then integrate them and justify any exclusion.</p><p><b>Ellipse method</b>: (1) place the most relevant processes in the first ellipse (the scope); (2) place the other processes of the organization in the second; (3) place the external services that interact with the scope processes in the third; (4) draw the relationships between them.</p><p>Supporting diagrams: the <b>functional structure</b> (areas in scope, lines of command); the <b>physical plant</b> (access points, physical barriers, facilities); the <b>logical network</b> (gateways, routers, firewalls, services).</p>
<h4 class="sec">4.4 Information security management system</h4>
<p><b>Requirement:</b> the organization establishes, implements, maintains and continually improves the ISMS. While the other clauses describe the requirements, 4.4 requires the organization to make sure all the required elements are in place.</p>`,
    simple: `<p>Start small with a few managers, refine it, get everyone affected to check it, and have top management sign it. Describe it from three angles: the org chart, the buildings and the network.</p>`,
    example: "",
    pages: "79–91", quote: "Documented information describing the scope should be formally approved by top management.", qp: "79",
    q: { type: "mcq", kind: "Recall", prompt: "Who formally approves the documented ISMS scope?",
      options: [
        ["The certification body", false, "The certification body audits the scope; it doesn't approve it for you."],
        ["The ISMS project manager", false, "The project manager coordinates the work, but approval sits higher."],
        ["Top management", true, "The final step is approval by top management."],
        ["All employees in scope", false, "Management within the scope evaluates it, but top management approves it."]
      ] } }
  ] },

{ id: "clause-5", num: "5", title: "Leadership", phase: "Plan", pages: "92–129",
  blurb: "Top management's role, the information security policy, and roles and responsibilities.",
  cards: [
  { id: "c5a", clause: "5.1", title: "Leadership and commitment",
    goal: "Describe what top management must do and what it cannot hand off.",
    body: `<h4 class="sec">Requirement</h4>
<p>Top management demonstrates leadership and commitment to the ISMS.</p>
<h4 class="sec">Explanation</h4>
<p><b>Top management</b> is the person or group who directs and controls the organization at the highest level and has overall responsibility for the ISMS. If the ISMS covers a business unit, it is that unit's top management.</p><p>Top management may <b>delegate authority</b> and provide resources, but <b>retains overall responsibility</b>. It also takes part in management review (clause 9) and promotes continual improvement (clause 10).</p>
<h4 class="sec">Guidance</h4>
<ul><li>Ensure the policy and objectives are established and consistent with the strategic direction.</li><li>Ensure ISMS requirements and controls are integrated into the organization's processes. Process owners can be given responsibility for applying requirements, but the ultimate responsibility stays with top management. Management support also helps overcome resistance to change.</li><li>Ensure resources are available: financial, personnel, facilities, technical infrastructure. Management review shows whether they are adequate.</li><li>Communicate the need for information security and for complying with the ISMS, using practical examples.</li><li>Ensure the ISMS achieves its intended outcomes, by requesting and reviewing reports on its status and effectiveness (from measurements, management reviews and audits). Performance objectives can be set for key ISMS personnel.</li><li>Direct and support the people involved; assess resource needs in management reviews; set objectives for continual improvement.</li><li>Support people with security roles so they are motivated and able to lead in their own areas.</li></ul><p>If the ISMS belongs to a larger organization, engaging the larger organization's leaders helps: decisions on resources can then be aligned with the ISMS.</p>`,
    simple: `<p>Leaders can hand out tasks, but not the accountability. They pay for it, talk about it, ask for reports, and back the people doing the work.</p>`,
    example: `<p>The CEO appoints a CISO and says, "Security is your problem now." Under 5.1, the CEO still owns the outcome and must keep providing resources and reviewing results.</p>`,
    pages: "97–103", quote: "Top management may delegate authority in the organization and provide resources to actually execute information security and ISMS related activities but still retains overall responsibility.", qp: "99",
    q: { type: "mcq", kind: "Apply", prompt: "A CEO appoints a CISO and announces: \"Information security is entirely the CISO's responsibility from now on.\" What does the deck say about this?",
      options: [
        ["It's correct: delegating to a qualified CISO meets 5.1", false, "Delegating authority is allowed, but overall responsibility can't be handed over."],
        ["Authority can be delegated, but top management keeps overall responsibility", true, "This is stated directly in the course."],
        ["Only the board, never the CEO, can hold responsibility", false, "Top management is whoever directs and controls the organization (or unit) at the highest level."],
        ["5.1 only applies during certification audits", false, "Leadership and commitment are continuous requirements."]
      ] } },
  { id: "c5b", clause: "5.2", title: "What the security policy is and is not",
    goal: "Tell a policy statement apart from a standard or procedure.",
    body: `<h4 class="sec">Requirement</h4>
<p>Top management establishes an information security policy.</p>
<h4 class="sec">Explanation</h4>
<p>The policy describes the strategic importance of the ISMS, directs security activities, and states the organization's real security needs. Its main purpose is to give <b>direction and management support</b> for information security. It is available as documented information.</p>
<h4 class="sec">Guidance</h4>
<ul><li>Brief, high-level statements of intent and direction. It may cover only the ISMS scope or be broader. All other security policies, procedures, activities and objectives align with it.</li><li>Reflects the business situation, culture, issues and concerns; balances readability and completeness, so users identify with its direction.</li><li>Includes the security objectives, <b>or</b> the framework for setting them (who sets them and how).</li><li>A clear statement of top management's <b>commitment to meet security requirements</b>.</li><li>A clear statement that top management supports <b>continual improvement</b>.</li><li>Communicated to everyone in the ISMS scope, in suitable format and language. Top management decides which stakeholders receive it. If shared externally, it contains no confidential information.</li><li>Can be a standalone policy or part of a wider management-system policy. No specific format is required; an existing template can be used.</li></ul>
<h4 class="sec">Methodology: what a policy is not</h4>
<p>A policy is <b>not a standard</b>. It does not say how specific work or controls are done, and does not name specific technologies. It contains general, high-level statements of an objective to achieve.</p>`,
    simple: `<p>The policy says <i>what</i> we're committed to and <i>why</i>. It never says <i>how</i> or <i>with which product</i>. That belongs in lower-level documents.</p>`,
    example: `<p>Policy-level: "We protect customer information according to its classification and continually improve our ISMS." Too detailed for a policy: "All laptops use BitLocker with AES-256." That belongs in a cryptography standard.</p>`,
    pages: "104–108, 124", quote: "It should NOT indicate how any specific work or control will be performed.", qp: "124",
    q: { type: "mcq", kind: "Apply", prompt: "Which sentence belongs in the information security policy itself?",
      options: [
        ["\"Management commits to meeting applicable information security requirements and to continually improving the ISMS.\"", true, "A high-level statement of commitment, which the deck says the policy should contain."],
        ["\"All laptops must use BitLocker with AES-256 encryption.\"", false, "This names a specific technology. A policy does not."],
        ["\"Firewall rule 14 allows inbound traffic on port 443 only.\"", false, "This is configuration detail for a procedure or standard."],
        ["\"Backups run at 02:00 every night to the NAS.\"", false, "This describes how a control works, which a policy should not."]
      ] } },
  { id: "c5c", clause: "5.2", title: "Policy hierarchy and drafting method",
    goal: "Place topic-specific policies under the security policy and know how to draft one.",
    body: `<h4 class="sec">Guidance: policy framework</h4>
<p>A policy is a statement of intent and direction formally expressed by top management. An organization may have several policies, some independent, some hierarchical:</p><ul><li>General high-level policies (for example a code of conduct).</li><li>The <b>information security policy</b>.</li><li><b>Topic-specific policies</b>, for example access control, clear desk and clear screen, backup, cryptographic controls. Some organizations call them standards, directives or rules.</li></ul><p>When developing any policy, consider: the organization's goals and objectives; its strategies; its structure and processes; the aims of the policy topic; requirements of higher-level policies; and the target group.</p>
<h4 class="sec">Guidance: structure of a policy</h4>
<div class="fig"><div class="scroll"><table><thead><tr><th>Section</th><th>Content</th></tr></thead><tbody><tr><td>Administrative</td><td>Name, version, validity dates, change history, owner and approver, classification, audience</td></tr><tr><td>Summary</td><td>One or two sentences</td></tr><tr><td>Introduction</td><td>Brief explanation of the subject</td></tr><tr><td>Scope</td><td>Parts or activities affected; other policies it supports</td></tr><tr><td>Objectives</td><td>The intent of the policy</td></tr><tr><td>Principles</td><td>Rules for actions and decisions to meet the objectives</td></tr><tr><td>Responsibilities</td><td>Who acts to meet the policy</td></tr><tr><td>Key results</td><td>Business results if objectives are met</td></tr><tr><td>Related policies</td><td>Other relevant policies</td></tr><tr><td>Policy requirements</td><td>The detailed requirements</td></tr></tbody></table></div></div>

<h4 class="sec">Guidance: topic-specific policies and Annex A</h4>
<div class="fig"><div class="scroll"><table><thead><tr><th>Policy topic</th><th>Annex A</th></tr></thead><tbody><tr><td>Acceptable use of information and other associated assets</td><td>5.10</td></tr><tr><td>Classification of information</td><td>5.12</td></tr><tr><td>Information transfer</td><td>5.14</td></tr><tr><td>Access control</td><td>5.15</td></tr><tr><td>Access rights</td><td>5.18</td></tr><tr><td>Information security in supplier relationships</td><td>5.19</td></tr><tr><td>Information security for use of cloud services</td><td>5.23</td></tr><tr><td>Intellectual property rights</td><td>5.32</td></tr><tr><td>Protection of records</td><td>5.33</td></tr><tr><td>Privacy and protection of PII</td><td>5.34</td></tr><tr><td>Remote working</td><td>6.7</td></tr><tr><td>Clear desk and clear screen</td><td>7.7</td></tr><tr><td>Storage media</td><td>7.10</td></tr><tr><td>User end point devices</td><td>8.1</td></tr><tr><td>Privileged access rights</td><td>8.2</td></tr><tr><td>Information access restriction</td><td>8.3</td></tr><tr><td>Secure authentication</td><td>8.5</td></tr><tr><td>Management of technical vulnerabilities</td><td>8.8</td></tr><tr><td>Information deletion</td><td>8.10</td></tr><tr><td>Data masking</td><td>8.11</td></tr><tr><td>Information backup</td><td>8.13</td></tr><tr><td>Logging</td><td>8.15</td></tr><tr><td>Segregation of networks</td><td>8.22</td></tr><tr><td>Use of cryptography</td><td>8.24</td></tr></tbody></table></div><p class="cap">The course's list. Control names follow the standard.</p></div>

<h4 class="sec">Methodology: drafting the policy</h4>
<ol><li>List <b>internal needs</b> (for example shareholders, employees).</li><li>List <b>external needs</b> (requirements, regulations and legislation, market forces).</li><li>Score the relationship between each need and each candidate guideline from 1 to 5, add the scores; the highest-scoring guidelines become the policy statements.</li><li>Review the mission, vision and principles for any security guideline not yet covered.</li><li>Write the policy.</li></ol><p>Drafting recommendations: state what is to be done and the guideline employees, contractors and third parties follow, aligned with strategy and scope; say whom it applies to; list exceptions and to whom they apply; reference supporting regulations; name contacts for questions and the person who authorizes it; describe how it is changed; state the consequences of breaching it; give the effective date.</p>`,
    simple: `<p>One umbrella security policy, with smaller topic policies under it. To write it, list what everyone needs, score which statements matter most, and keep the top ones.</p>`,
    example: "",
    note: `<p>The deck lists "Login" next to Annex A control 8.15. In the published standard 8.15 is <i>Logging</i>; this looks like a translation slip.</p>`,
    pages: "109–123", quote: "Establish the degree of relationship that each one of them has, valuing it on a scale of 1 to 5 (5 being the highest value), then add them up and the most representative values correspond to guidelines or phrases that should make up the Policy.", qp: "120",
    q: { type: "mcq", kind: "Recall", prompt: "In the deck's drafting method, how are the policy statements chosen?",
      options: [
        ["Copied from the Annex A control titles", false, "Annex A informs topic-specific policies, but the method starts from stakeholder needs."],
        ["Each guideline is scored 1–5 against each need; the highest totals become statements", true, "This is the course's relationship-scoring step."],
        ["The certification body provides a template", false, "Organizations may use their own templates; the content comes from their needs."],
        ["The CISO writes what they think best", false, "The method is structured around internal and external needs, then checked against mission and vision."]
      ] } },
  { id: "c5d", clause: "5.3", title: "Roles, responsibilities and authorities",
    goal: "Name which security activities need assigned owners, and where else responsibilities live.",
    body: `<h4 class="sec">Requirement</h4>
<p>Top management ensures that the responsibilities and authorities of roles relevant to information security are assigned and communicated throughout the organization.</p>
<h4 class="sec">Explanation</h4>
<p>The purpose is twofold: make sure the ISMS <b>conforms to ISO/IEC 27001</b>, and make sure <b>ISMS performance is reported to top management</b>.</p>
<h4 class="sec">Guidance</h4>
<p>Top management periodically makes sure responsibilities and authorities are assigned, and <b>approves the main ISMS roles</b>. It need not assign every role itself, but must delegate the authority to do so properly. Assign responsibility and authority for these activities:</p><ul><li>coordinating the establishment, implementation, maintenance, performance reporting and improvement of the ISMS;</li><li>advising on information security risk assessment and treatment;</li><li>designing security processes and systems;</li><li>setting standards for determining, configuring and operating controls;</li><li>managing security incidents;</li><li>reviewing and auditing the ISMS.</li></ul><p>Security responsibilities also belong in other roles: information owners, process owners, asset owners, risk owners, the security coordinator (normally a <b>support role</b>), project managers, line managers and information users. Documented information is needed only as far as the organization finds it necessary.</p>`,
    simple: `<p>Someone must clearly own each security job, and everyone knows who. Security isn't only the security team's job; owners and managers carry part of it too.</p>`,
    example: "",
    pages: "125–129", quote: "The purpose of this requirement is to assign responsibilities and authorities to ensure compliance of the ISMS with the requirements of ISO IEC 27001:2022 and to ensure reporting of ISMS performance to top management.", qp: "126",
    q: { type: "open", kind: "Apply", prompt: "Name three roles outside the security team that should carry information security responsibilities.",
      answer: `<p>Any three of: <b>information owners, process owners, asset owners (application or infrastructure owners), risk owners, project managers, line managers, information users</b>.</p>` } }
  ] },

{ id: "clause-6", num: "6", title: "Planning", phase: "Plan", pages: "130–207",
  blurb: "Risk criteria and acceptance criteria, risk assessment, risk treatment, the Statement of Applicability, the treatment plan, objectives and change.",
  cards: [
  { id: "c6o", clause: "6.1.2–6.1.3", title: "The course's risk management model, step by step",
    goal: "Follow the course's risk methodology from criteria to risk owner approval, and name the output of each step.",
    body: `<p>The course gives the Lead Implementer one key skill in this module: <b>design and apply a risk management model</b>, including risk assessment and risk treatment planning. The model follows <b>ISO 31000</b>: scope, context and criteria → risk assessment (identification, analysis, evaluation) → risk treatment. <b>Communication and consultation</b>, <b>follow-up and review</b>, and <b>recording and reporting</b> run alongside every step.</p><p>The course's methodology turns this into numbered steps. The table maps each step to the clause it satisfies and the output it produces.</p>`,
    diagram: `<div class="fig"><div class="scroll"><table><thead><tr><th>Step</th><th>Course methodology</th><th>Clause</th><th>Output</th></tr></thead><tbody><tr><td>1</td><td><b>Establish the criteria</b>: from the context (4.1), the scope and the stakeholders (4.2), set consequence and probability criteria, a method to combine them into a risk level, the <b>maximum acceptable risk level</b>; criteria authorized by management</td><td>6.1.2 a), b)</td><td>Risk methodology and acceptance criteria</td></tr><tr><td>2</td><td><b>Risk identification</b>: event-based and/or asset–threat–vulnerability approach; name the risk owners</td><td>6.1.2 c)</td><td>Asset inventory, list of risks with owners</td></tr><tr><td>3</td><td><b>Risk analysis</b>: consequences and probability give the risk level</td><td>6.1.2 d)</td><td>Risk levels</td></tr><tr><td>4</td><td><b>Risk evaluation</b>: compare each level with the acceptance criteria</td><td>6.1.2 e)</td><td>List of risks in order of priority</td></tr><tr><td>5</td><td><b>Risk treatment</b>: choose an option for each risk (avoid, assume, modify, share, retain)</td><td>6.1.3 a)</td><td>Treatment option per risk</td></tr><tr><td>6</td><td><b>Define controls</b> needed to carry out the options</td><td>6.1.3 b)</td><td>Control list linked to risks</td></tr><tr><td>7</td><td><b>Compare controls</b> with Annex A so none is overlooked</td><td>6.1.3 c)</td><td>Checked control list</td></tr><tr><td>8</td><td><b>Generate the SoA</b></td><td>6.1.3 d)</td><td>Statement of Applicability</td></tr><tr><td>9</td><td><b>Design the risk treatment plan</b></td><td>6.1.3 e)</td><td>Risk treatment plan</td></tr><tr><td>10</td><td><b>Obtain the risk owners' approval</b> and record acceptance of residual risk</td><td>6.1.3 f)</td><td>Signed approval</td></tr></tbody></table></div><p class="cap">Steps from the course's risk methodology slides. Clause letters checked against ISO/IEC 27001:2022, which matches the course here. All steps and results are kept as documented information.</p></div>`,
    simple: `<p>Set the rules for judging risk (including what's acceptable). Find the risks and who owns them. Rate them and sort them. Decide what to do about each one and which controls to use. Check the controls against Annex A, write the SoA and the treatment plan, and get the risk owners to sign. Then set objectives and plan any changes.</p>`,
    example: "",
    pages: "130–207", quote: "Information security risk treatment is the overall process of selecting risk treatment options, determining the appropriate controls to implement those options, formulating a risk treatment plan, and obtaining approval of the risk treatment plan from the risk owners.", qp: "176",
    q: { type: "mcq", kind: "Order", prompt: "Which order matches clause 6.1.2 and 6.1.3?",
      options: [
        ["Identify risks → set acceptance criteria → write the SoA → analyse risks", false, "The criteria come first (6.1.2 a), so every risk is judged against the same rules."],
        ["Set risk criteria → identify → analyse → evaluate → choose options and controls → compare with Annex A → SoA → treatment plan → risk owners approve", true, "This follows 6.1.2 a) to e) and then 6.1.3 a) to f)."],
        ["Choose controls from Annex A → assess risks → set criteria → treatment plan", false, "Controls follow from the assessed risks; Annex A is used afterwards to check nothing is missing (6.1.3 c)."],
        ["Write the treatment plan → have the auditor approve it → assess the risks", false, "Risk owners, not auditors, approve the plan (6.1.3 f), and the plan comes after assessment."]
      ] } },
  { id: "c6a", clause: "6.1", title: "Two kinds of risk",
    goal: "Separate ISMS-level risks and opportunities from information security risks.",
    body: `<h4 class="sec">How risk works</h4>
<p>The course's risk model: <b>threats exploit vulnerabilities</b>; vulnerabilities expose <b>assets</b>, which have <b>value</b>; threats, vulnerabilities and asset value all increase the <b>risk</b>; risks indicate <b>security requirements</b>, which are met by <b>controls</b> that protect against threats.</p>
<h4 class="sec">Two categories of risk</h4>
