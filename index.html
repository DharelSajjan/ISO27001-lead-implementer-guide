function practiceList() { return ALL.filter(x => S.marks[x.c.id] === "practice"); }

function renderIndex(route) {
  const link = (href, n, t, p) => `<a href="#${href}"${route === href ? ' aria-current="page"' : ""}><span class="n">${n}</span><span>${t}</span><span class="p">${p}</span></a>`;
  let h = link("start", "§", "Start here", "");
  h += `<div class="group">The implementer's view</div>`;
  h += link(MODULES[0].id, MODULES[0].num, MODULES[0].title, `${modProgress(MODULES[0])}/${MODULES[0].cards.length}`);
  h += link("playbook", "→", "Implementation playbook", "");
  h += link("roles", "◎", "Roles and responsibilities", "");
  h += link("requirements", "≡", "All requirements", "");
  h += link("documents", "▤", "Documents checklist", "");
  h += link("examples", "✎", "Worked examples", String(EXAMPLES.length));
  h += `<div class="group">Clause by clause</div>`;
  MODULES.slice(1).forEach(m => { h += link(m.id, m.num, m.title, `${modProgress(m)}/${m.cards.length}`); });
  h += `<div class="group">Exam practice</div>`;
  h += link("case", "▶", "Case study", `${Object.keys(caseAns).length}/${CASE.length}`);
  h += link("traps", "!", "Exam traps and terms", "");
  h += link("quiz", "?", "Mixed quiz", "");
  h += link("review", "↺", "Weak spots", String(practiceList().length));
  $index.innerHTML = h;
}

function sourceBlock(c) {
  return `<section class="source" aria-label="From the course"><div class="head"><span class="lbl">From the course</span></div>
<blockquote>“${c.quote}”</blockquote></section>`;
}

function questionBlock(c) {
  const q = c.q;
  let h = `<section class="check" aria-labelledby="q-${c.id}"><h3 id="q-${c.id}">Check yourself <span class="kind">${q.kind}</span></h3><p class="prompt">${q.prompt}</p>`;
  if (q.type === "mcq") {
    h += `<div class="opts" role="group" aria-label="Answer options">` + q.options.map((o, i) =>
      `<button class="opt" data-act="opt" data-card="${c.id}" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${o[0]}</span></button>`).join("") + `</div><div class="fbwrap" aria-live="polite"></div>`;
  } else {
    h += `<label class="lbl" for="ta-${c.id}" style="color:var(--muted)">Your answer (only you see this)</label><textarea id="ta-${c.id}" placeholder="Try it from memory first…"></textarea>
<div class="row"><button class="btn primary" data-act="reveal" data-card="${c.id}">Show model answer</button></div><div class="fbwrap" aria-live="polite"></div>`;
  }
  return h + `</section>`;
}

function renderCard(m) {
  const n = m.cards.length;
  let i = Math.min(Math.max(S.pos[m.id] || 0, 0), n - 1);
  const c = m.cards[i];
  const mark = S.marks[c.id];
  const phase = m.phase ? `<span class="chip phase">${m.phase}</span>` : "";
  const clause = c.clause ? `<span class="chip clause">Clause ${c.clause}</span>` : `<span class="chip">Module ${m.num}</span>`;
  return `<article class="sheet" data-id="${c.id}">
<div class="meta">${clause}${phase}<span class="step">Lesson ${i + 1} of ${n}</span></div>
<h2>${c.title}</h2>
<p class="goal"><span class="lbl">Goal</span><span>${c.goal}</span></p>
<div class="explain" id="full-${c.id}">${c.body}</div>
<div class="simpler" id="simple-${c.id}" hidden><span class="lbl">In plain words</span>${c.simple}</div>
<div class="row"><button class="btn" data-act="simple" data-card="${c.id}" aria-pressed="false" aria-controls="simple-${c.id}">Explain more simply</button></div>
${c.diagram || ""}
${c.example ? `<details class="gen"><summary>Show an example</summary><span class="tag">Illustrative · not from the deck</span>${c.example}</details>` : ""}
${c.note ? `<div class="note"><span class="tag">Note</span>${c.note}</div>` : ""}
${implBlock(c)}
${prepBlock(c)}
${questionBlock(c)}
${sourceBlock(c)}
<div class="foot">
  <div class="row" role="group" aria-label="How well do you know this?">
    <button class="btn mark-got" data-act="mark" data-v="got" data-card="${c.id}" aria-pressed="${mark === "got"}">Got it</button>
    <button class="btn mark-prac" data-act="mark" data-v="practice" data-card="${c.id}" aria-pressed="${mark === "practice"}">Needs practice</button>
  </div>
  <div class="row">
    <button class="btn" data-act="prev" data-m="${m.id}" ${i === 0 ? "disabled" : ""}>← Previous</button>
    ${i < n - 1 ? `<button class="btn primary" data-act="next" data-m="${m.id}">Next lesson →</button>` : nextModuleBtn(m)}
  </div>
</div></article>`;
}
function nextModuleBtn(m) {
  const k = MODULES.indexOf(m);
  if (k === 0) return `<a class="btn primary" href="#playbook" style="text-decoration:none">Open the playbook →</a>`;
  return k < MODULES.length - 1 ? `<a class="btn primary" href="#${MODULES[k + 1].id}" style="text-decoration:none">Next module →</a>` : `<a class="btn primary" href="#case" style="text-decoration:none">Try the case study →</a>`;
}

function renderStart() {
  const prac = practiceList().length;
  return `<section class="intro">
<h2>Prepare for the Lead Implementer exam</h2>
<p>The course is broken into ${ALL.length} short lessons, viewed from the job you are training for: <b>implementing an ISMS</b>. Each lesson follows the course slides: the <b>Requirement</b>, then the course's <b>Explanation</b>, <b>Guidance</b> and <b>Methodology</b> for it. Where the slides leave something out or differ from the published standard, a <b>Checked against ISO/IEC 27001:2022</b> box says so. Every lesson also has a goal, an <b>As the implementer</b> panel (what you do, who decides, what you produce, the exam trap), a question to answer before you see the solution, and a key line from the course.</p>
<h3 class="display" style="font-size:1.05rem">Suggested route</h3>
<ol class="route">
  <li><a href="#role">Your role as implementer</a>: what you lead, what others decide, and how the clauses connect.</li>
  <li><a href="#playbook">Implementation playbook</a>: the whole job in order, with the documents to prepare after each step.</li>
  <li><a href="#requirements">All requirements</a>: every clause of the standard in one table, with what it asks for.</li>
  <li><a href="#examples">Worked examples</a>: filled-in documents (business case, gap assessment, scope, policy, risk register, SoA, audit report and more) showing what each step produces.</li>
  <li>Modules 1–10, clause by clause, for the detail. Keep the <a href="#roles">roles</a> and <a href="#documents">documents</a> pages at hand.</li>
  <li><a href="#case">Case study</a>: implement an ISMS for a fictional company, one decision at a time.</li>
  <li><a href="#traps">Exam traps</a>, then the <a href="#quiz">mixed quiz</a> and your <a href="#review">weak spots</a> until they stick.</li>
</ol>
<div class="legend">
  <div class="l1"><span class="tag">From the course</span>A short quote from the course material.</div>
  <div class="l2"><span class="tag">Illustrative · not from the course</span>Examples written to make an idea concrete. They are not part of the course material.</div>
  <div class="l4"><span class="tag">Checked against ISO/IEC 27001:2022</span>Only where the course misses or misstates something. The course is the main source.</div>
  <div class="l3"><span class="tag">Note</span>Extraction problems, or background that differs from the deck. Always labelled as such.</div>
</div>
<p>Mark each lesson <b>Got it</b> or <b>Needs practice</b>. Lessons that need practice collect under <a href="#review">Weak spots</a>${prac ? ` (${prac} now)` : ""}. Progress is saved in this browser only.</p>
<div class="modlist">${MODULES.map(m => `<a href="#${m.id}"><span class="n">${m.num}</span><span><span class="t">${m.title}</span><span class="d">${m.blurb}</span></span><span class="p">${modProgress(m)}/${m.cards.length}</span></a>`).join("")}</div>
<div class="row"><a class="btn primary" href="#role" style="text-decoration:none">Start with your role →</a><a class="btn" href="#case" style="text-decoration:none">Try the case study</a>
<button class="btn" data-act="reset">${resetArmed ? "Click again to erase all progress" : "Reset progress"}</button></div>
</section>`;
}

function renderReview() {
  const list = practiceList();
  let h = `<section class="intro"><h2>Weak spots</h2><p>Lessons you marked <b>Needs practice</b>. Open one, answer its question again, and mark it <b>Got it</b> when it sticks.</p>`;
  if (!list.length) h += `<p class="empty">Nothing here yet. When a lesson feels shaky, mark it "Needs practice" and it will appear here.</p>`;
  else h += `<div class="list">` + list.map(x => `<div class="item"><div><div class="t">${x.c.title}</div><div class="s">Module ${x.m.num} · ${x.m.title}${x.c.clause ? " · Clause " + x.c.clause : ""}</div></div><button class="btn" data-act="goto" data-m="${x.m.id}" data-i="${x.i}">Open</button></div>`).join("") + `</div>`;
  return h + `</section>`;
}

function newQuiz() {
  const pool = ALL.filter(x => x.c.q.type === "mcq").map(x => x.c.id);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  quizSet = pool.slice(0, 10); quizAns = {};
}
function renderQuiz() {
  if (!quizSet) newQuiz();
  const answered = Object.keys(quizAns).length;
  const right = Object.entries(quizAns).filter(([id, i]) => byId(id).c.q.options[i][1]).length;
  let h = `<section class="intro"><h2>Mixed quiz</h2><p>Ten questions drawn at random from all modules. Answer from memory; each answer shows why it is right or wrong and links back to its lesson.</p>
<div class="row"><span class="score">${answered} of ${quizSet.length} answered · ${right} correct</span><button class="btn" data-act="newquiz">New set of questions</button></div>`;
  quizSet.forEach((id, k) => {
    const x = byId(id), q = x.c.q, a = quizAns[id];
    h += `<div class="qblock"><div class="meta"><span class="chip">Q${k + 1}</span><span class="chip">Module ${x.m.num}</span><span class="kind">${q.kind}</span></div><p class="prompt">${q.prompt}</p><div class="opts">` +
      q.options.map((o, i) => {
        let cls = "opt";
        if (a !== undefined) cls += o[1] ? " is-right" : (i === a ? " is-wrong" : " is-dim");
        return `<button class="${cls}" data-act="qopt" data-card="${id}" data-i="${i}" ${a !== undefined ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span>${o[0]}</span></button>`;
      }).join("") + `</div>`;
    if (a !== undefined) {
      const ok = q.options[a][1], ri = q.options.findIndex(o => o[1]);
      h += `<div class="fb ${ok ? "good" : "bad"}"><span class="tag">${ok ? "Correct" : "Not quite"}</span><p>${q.options[a][2]}</p>${ok ? "" : `<p><b>${LETTERS[ri]}</b> is right: ${q.options[ri][2]}</p>`}<p><a href="#${x.m.id}" data-act="goto" data-m="${x.m.id}" data-i="${x.i}">Review the lesson "${x.c.title}"</a></p></div>`;
    }
    h += `</div>`;
  });
  return h + `</section>`;
}

const VIEWS_ALL = Object.freeze({ review: renderReview, quiz: renderQuiz, playbook: renderPlaybook, roles: renderRoles, documents: renderDocs, requirements: renderReqs, traps: renderTraps, "case": renderCase, examples: exList });
function route() {
  const r = (location.hash || "#start").slice(1);
  const m = MODULES.find(x => x.id === r);
  const hasView = Object.prototype.hasOwnProperty.call(VIEWS_ALL, r);
  const VIEWS = VIEWS_ALL;
  const isEx = EXAMPLES.some(e => e.id === r);
  const key = m ? r : (hasView ? r : (isEx ? "examples" : "start"));
  renderIndex(key);
  if (m) $main.innerHTML = renderCard(m);
  else if (isEx) $main.innerHTML = exView(r);
  else if (hasView) $main.innerHTML = VIEWS[key]();
  else if (key === "review") $main.innerHTML = renderReview();
  else if (key === "quiz") $main.innerHTML = renderQuiz();
  else $main.innerHTML = renderStart();
}

function showMcqFeedback(card, i) {
  const c = byId(card).c, q = c.q, sheet = $main.querySelector(`[data-id="${card}"]`);
  const btns = sheet.querySelectorAll('.opt');
  const ri = q.options.findIndex(o => o[1]);
  btns.forEach((b, k) => { b.disabled = true; b.classList.add(q.options[k][1] ? "is-right" : (k === i ? "is-wrong" : "is-dim")); });
  const ok = q.options[i][1];
  sheet.querySelector(".fbwrap").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><span class="tag">${ok ? "Correct" : "Not quite"}</span><p>${q.options[i][2]}</p>${ok ? "" : `<p><b>${LETTERS[ri]}</b> is right: ${q.options[ri][2]}</p>`}<button class="btn" data-act="retry" data-card="${card}" style="align-self:start">Try again</button></div>`;
  S.done[card] = true; save();
}

$main.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, card = b.dataset.card;
  if (act === "simple") {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "Show full explanation" : "Explain more simply";
    document.getElementById("simple-" + card).hidden = !on;
    document.getElementById("full-" + card).hidden = on;
  } else if (act === "opt") {
    showMcqFeedback(card, +b.dataset.i);
  } else if (act === "retry") {
    route();
  } else if (act === "reveal") {
    const c = byId(card).c;
    b.closest(".check").querySelector(".fbwrap").innerHTML = `<div class="model"><span class="tag">Model answer</span>${c.q.answer}<p style="font-size:.9rem;color:var(--muted)">Compare it with yours, then mark the lesson below.</p></div>`;
    b.disabled = true; S.done[card] = true; save();
  } else if (act === "mark") {
    const v = b.dataset.v;
    S.marks[card] = S.marks[card] === v ? undefined : v;
    if (!S.marks[card]) delete S.marks[card];
    save();
    b.parentElement.querySelectorAll("[data-act=mark]").forEach(x => x.setAttribute("aria-pressed", String(S.marks[card] === x.dataset.v)));
    renderIndex((location.hash || "#start").slice(1));
  } else if (act === "next" || act === "prev") {
    const id = b.dataset.m; S.pos[id] = (S.pos[id] || 0) + (act === "next" ? 1 : -1); save(); route();
    $main.focus({ preventScroll: true }); window.scrollTo({ top: 0 });
  } else if (act === "goto") {
    e.preventDefault();
    S.pos[b.dataset.m] = +b.dataset.i; save();
    if (location.hash === "#" + b.dataset.m) route(); else location.hash = b.dataset.m;
    window.scrollTo({ top: 0 });
  } else if (act === "qopt") {
    quizAns[card] = +b.dataset.i; const y = window.scrollY; route(); window.scrollTo({ top: y });
  } else if (act === "copt") {
    caseAns[b.dataset.k] = +b.dataset.i; const y = window.scrollY; route(); window.scrollTo({ top: y });
  } else if (act === "exopt" || act === "exreveal") {
    const k = b.dataset.k, ta = document.getElementById("exta-" + k), txt = ta ? ta.value : "";
    exAns[k] = act === "exopt" ? +b.dataset.i : true;
    const y = window.scrollY; route(); window.scrollTo({ top: y });
    const ta2 = document.getElementById("exta-" + k); if (ta2) ta2.value = txt;
  } else if (act === "caseReset") {
    caseAns = {}; route();
  } else if (act === "newquiz") {
    newQuiz(); route();
  } else if (act === "reset") {
    if (!resetArmed) { resetArmed = true; route(); return; }
    S = { marks: {}, pos: {}, done: {} }; save(); resetArmed = false; route();
  }
});

$main.addEventListener("input", e => {
  if (e.target.id !== "reqfilter") return;
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  $main.querySelectorAll("table.reqs tbody tr").forEach(tr => {
    if (tr.classList.contains("grp")) return;
    const on = !q || tr.textContent.toLowerCase().includes(q);
    tr.hidden = !on; if (on) shown++;
  });
  $main.querySelectorAll("table.reqs tr.grp").forEach(g => {
    let n = g.nextElementSibling, any = false;
    while (n && !n.classList.contains("grp")) { if (!n.hidden) any = true; n = n.nextElementSibling; }
    g.hidden = !any;
  });
  document.getElementById("reqnone").hidden = shown > 0;
});

document.addEventListener("keydown", e => {
  if (e.target.closest("textarea, input")) return;
  const sheet = $main.querySelector(".sheet"); if (!sheet) return;
  if (e.key === "ArrowRight") { const n = sheet.querySelector("[data-act=next], .foot a.btn.primary"); if (n) n.click(); }
  if (e.key === "ArrowLeft") { const p = sheet.querySelector("[data-act=prev]:not(:disabled)"); if (p) p.click(); }
});
window.addEventListener("hashchange", () => { resetArmed = false; route(); window.scrollTo({ top: 0 }); });
route();
</script>
</body>
</html>
